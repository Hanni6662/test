    - data:
        code: "import hashlib\nimport json\nimport uuid\n\n\ndef main(backend_context,\
          \ workflow_run_id, audit):\n    context = json.loads(backend_context) if\
          \ isinstance(backend_context, str) else backend_context\n    if not isinstance(context,\
          \ dict):\n        raise ValueError('backend context is invalid')\n    if\
          \ context.get('contract_version') != 'visual-v34-stage-v1':\n        raise\
          \ ValueError('backend contract version is invalid')\n    if context.get('flow_version')\
          \ != 'visual-v3.4-single-selection':\n        raise ValueError('backend\
          \ flow version is invalid')\n    session_id = str(uuid.UUID(context.get('business_session_id',\
          \ '')))\n    recommendation_id = str(uuid.UUID(context.get('recommendation_id',\
          \ '')))\n    uuid.UUID(context.get('start_operation_id', ''))\n    revision\
          \ = context.get('recommendation_revision')\n    if isinstance(revision,\
          \ bool) or not isinstance(revision, int) or revision < 1:\n        raise\
          \ ValueError('recommendation revision is invalid')\n    if not isinstance(workflow_run_id,\
          \ str) or not workflow_run_id.strip():\n        raise ValueError('workflow\
          \ run id is invalid')\n    if not isinstance(audit, str) or len(audit.encode('utf-8'))\
          \ > 65536:\n        raise ValueError('recommendation audit is invalid')\n\
          \    event = {\n        'contract_version': 'visual-v34-stage-v1',\n   \
          \     'flow_version': 'visual-v3.4-single-selection',\n        'business_session_id':\
          \ session_id,\n        'recommendation_id': recommendation_id,\n       \
          \ 'recommendation_revision': revision,\n        'dify_run_id': workflow_run_id,\n\
          \        'node_id': 'prepare',\n        'event_key': 'rec:' + hashlib.sha256(workflow_run_id.encode('utf-8')).hexdigest(),\n\
          \        'digest_version': 1,\n        'event_type': 'recommendation.ready',\n\
          \        'payload': {'audit': audit},\n    }\n    canonical = json.dumps(event,\
          \ sort_keys=True, separators=(',', ':'), ensure_ascii=False, allow_nan=False)\n\
          \    event['digest'] = hashlib.sha256(canonical.encode('utf-8')).hexdigest()\n\
          \    return {\n        'body': json.dumps(event, separators=(',', ':'),\
          \ ensure_ascii=False, allow_nan=False),\n        'business_session_id':\
          \ session_id,\n        'event_key': event['event_key'],\n    }\n"
