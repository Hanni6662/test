          \ context_body, context_status_code,\n         expected_session_id, expected_recommendation_id,\
          \ expected_revision,\n         expected_task_id, expected_submission_id,\
          \ expected_run_id, expected_event_key):\n    try:\n        post = load(post_body)\n\
          \        context = load(context_body)\n        post_accepted = (\n     \
          \       int(post_status_code) == 200\n            and isinstance(post, dict)\n\
          \            and post.get('status') == 'accepted'\n            and post.get('business_session_id')\
          \ == expected_session_id\n            and post.get('event_key') == expected_event_key\n\
          \        )\n        context_accepted = (\n            int(context_status_code)\
          \ == 200\n            and isinstance(context, dict)\n            and context.get('contract_version')\
          \ == 'visual-v34-stage-v1'\n            and context.get('flow_version')\
          \ == 'visual-v3.4-single-selection'\n            and context.get('phase')\
          \ == 'selection'\n            and context.get('selection_status') == 'accepted'\n\
          \            and context.get('business_session_id') == expected_session_id\n\
          \            and context.get('recommendation_id') == expected_recommendation_id\n\
          \            and str(context.get('recommendation_revision')) == expected_revision\n\
          \            and context.get('task_id') == expected_task_id\n          \
          \  and context.get('selection_submission_id') == expected_submission_id\n\
          \            and context.get('dify_run_id') == expected_run_id\n       \
          \ )\n        return {'ok': 'yes' if post_accepted or context_accepted else\
          \ 'no'}\n    except (TypeError, ValueError, json.JSONDecodeError):\n   \
          \     return {'ok': 'no'}\n"
