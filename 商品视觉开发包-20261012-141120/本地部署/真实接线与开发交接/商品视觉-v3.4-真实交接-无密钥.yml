          \ str) else '{}'\n        return {\n            'valid': 'no', 'generation_request_id':\
          \ '', 'task_id': '',\n            'batch_id': '', 'source_sequence': 0,\
          \ 'snapshot': previous,\n            'event_body': '{}', 'manifest_body':\
          \ '{}', 'done': 'no',\n        }\n"
