        code: "import hashlib\nimport json\nimport re\nimport uuid\n\n\ndef load(value):\n\
          \    return json.loads(value) if isinstance(value, str) else value\n\n\n\
          def main(backend_context_raw, workflow_run_id):\n    empty = {'ready': 'no',\
          \ 'body': '{}', 'business_session_id': '', 'event_key': ''}\n    try:\n\
          \        context = load(backend_context_raw)\n        if not isinstance(context,\
          \ dict):\n            return empty\n        if context.get('contract_version')\
          \ != 'visual-v34-stage-v1':\n            return empty\n        if context.get('flow_version')\
          \ != 'visual-v3.4-single-selection':\n            return empty\n       \
          \ session_id = str(uuid.UUID(context.get('business_session_id', '')))\n\
          \        recommendation_id = str(uuid.UUID(context.get('recommendation_id',\
          \ '')))\n        uuid.UUID(context.get('start_operation_id', ''))\n    \
          \    revision = context.get('recommendation_revision')\n        if isinstance(revision,\
          \ bool) or not isinstance(revision, int) or revision < 1:\n            return\
          \ empty\n        if not isinstance(workflow_run_id, str) or not re.fullmatch(r'[A-Za-z0-9_.:-]{1,320}',\
          \ workflow_run_id):\n            return empty\n        event_key = 'selection.cancelled:'\
          \ + hashlib.sha256(workflow_run_id.encode('utf-8')).hexdigest()\n      \
          \  event = {\n            'contract_version': 'visual-v34-stage-v1',\n \
          \           'flow_version': 'visual-v3.4-single-selection',\n          \
          \  'business_session_id': session_id,\n            'recommendation_id':\
          \ recommendation_id,\n            'recommendation_revision': revision,\n\
          \            'dify_run_id': workflow_run_id,\n            'node_id': 'selection_cancelled_callback',\n\
          \            'event_key': event_key,\n            'digest_version': 1,\n\
          \            'event_type': 'selection.cancelled',\n            'payload':\
          \ {'reason_code': 'FORM_CANCELLED'},\n        }\n        canonical = json.dumps(event,\
          \ sort_keys=True, separators=(',', ':'), ensure_ascii=False, allow_nan=False)\n\
          \        event['digest'] = hashlib.sha256(canonical.encode('utf-8')).hexdigest()\n\
          \        return {\n            'ready': 'yes',\n            'body': json.dumps(event,\
          \ separators=(',', ':'), ensure_ascii=False, allow_nan=False),\n       \
          \     'business_session_id': session_id,\n            'event_key': event_key,\n\
          \        }\n    except (TypeError, ValueError, KeyError, json.JSONDecodeError):\n\
          \        return empty\n"
