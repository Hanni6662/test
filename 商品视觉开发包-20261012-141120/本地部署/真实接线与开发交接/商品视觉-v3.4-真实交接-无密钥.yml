    - data:
        code: "import hashlib\nimport json\nimport re\nimport uuid\nfrom datetime\
          \ import datetime, timezone\n\ndef obj(value):\n    value = json.loads(value)\
          \ if isinstance(value, str) else value\n    if not isinstance(value, dict):\n\
          \        raise ValueError('expected object')\n    return value\n\ndef canonical_sha256(value):\n\
          \    payload = json.dumps(value, ensure_ascii=False, sort_keys=True,\n \
          \                        separators=(',', ':'), allow_nan=False).encode('utf-8')\n\
          \    return hashlib.sha256(payload).hexdigest()\n\ndef canonical_uuid(value):\n\
          \    if not isinstance(value, str):\n        return False\n    try:\n  \
          \      return str(uuid.UUID(value)) == value\n    except (TypeError, ValueError,\
          \ AttributeError):\n        return False\n\ndef main(body, status_code,\
          \ task_id, submission_id, package_digest, image_types,\n         submission_body):\n\
          \    empty = {'ready': 'no', 'accepted_body': '{}'}\n    try:\n        if\
          \ int(status_code) != 200:\n            return empty\n        result = obj(body)\n\
          \        submission = obj(submission_body)\n        types = json.loads(image_types)\
          \ if isinstance(image_types, str) else image_types\n        expected_fields\
          \ = {'status', 'contract_version', 'task_id', 'submission_id',\n       \
          \                    'generation_request_id', 'package_digest', 'slots',\
          \ 'permit'}\n        if (set(result) != expected_fields or result.get('status')\
          \ not in {'accepted', 'replayed'}\n                or result.get('contract_version')\
          \ != 'chatflow-handoff-v1'\n                or result.get('task_id') !=\
          \ task_id or result.get('submission_id') != submission_id\n            \
          \    or result.get('package_digest') != package_digest):\n            return\
          \ empty\n        if (submission.get('task_id') != task_id\n            \
          \    or submission.get('submission_id') != submission_id\n             \
          \   or submission.get('package_digest') != package_digest):\n          \
          \  return empty\n        expected_request = str(uuid.uuid5(uuid.UUID(task_id),\n\
          \                                          'chatflow-generation-request:'\
          \ + submission_id))\n        if result.get('generation_request_id') != expected_request:\n\
          \            return empty\n        permit = result.get('permit')\n     \
          \   permit_fields = {'permit_id', 'permit_version', 'contract_version',\
          \ 'slot_mapping_digest',\n                         'reference_manifest_digest',\
          \ 'token', 'digest', 'expires_at'}\n        if (not isinstance(permit, dict)\
          \ or set(permit) != permit_fields\n                or permit.get('permit_version')\
          \ != 2\n                or permit.get('contract_version') != 'chatflow-generation-permit-v2'\n\
          \                or not isinstance(permit.get('token'), str) or not permit['token']\n\
          \                or not re.fullmatch(r'[0-9a-f]{64}', str(permit.get('slot_mapping_digest',\
          \ '')))\n                or not re.fullmatch(r'[0-9a-f]{64}', str(permit.get('reference_manifest_digest',\
          \ '')))\n                or not re.fullmatch(r'[0-9a-f]{64}', str(permit.get('digest',\
          \ '')))\n                or hashlib.sha256(permit['token'].encode('ascii')).hexdigest()\
          \ != permit['digest']):\n            return empty\n        try:\n      \
          \      if str(uuid.UUID(permit.get('permit_id', ''))) != permit.get('permit_id'):\n\
          \                return empty\n        except (TypeError, ValueError, AttributeError):\n\
          \            return empty\n        expiry = datetime.fromisoformat(str(permit.get('expires_at',\
          \ '')).replace('Z', '+00:00'))\n        if expiry.tzinfo is None or expiry.astimezone(timezone.utc)\
          \ <= datetime.now(timezone.utc):\n            return empty\n        slots\
          \ = result.get('slots')\n        if not isinstance(types, list) or not 1\
          \ <= len(types) <= 8 or not isinstance(slots, list) or len(slots) != len(types):\n\
          \            return empty\n        slot_mapping = []\n        task_items,\
          \ attempts = set(), set()\n        for position, slot in enumerate(slots,\
          \ 1):\n            if (not isinstance(slot, dict)\n                    or\
          \ set(slot) != {'task_item_id', 'attempt_id', 'slot_id', 'position', 'image_type'}\n\
          \                    or slot.get('slot_id') != 'slot_%02d' % position\n\
          \                    or not isinstance(slot.get('position'), int)\n    \
          \                or isinstance(slot.get('position'), bool)\n           \
          \         or slot.get('position') != position\n                    or slot.get('image_type')\
          \ != types[position - 1]):\n                return empty\n            item_id\
          \ = slot.get('task_item_id')\n            attempt_id = slot.get('attempt_id')\n\
          \            if not canonical_uuid(item_id) or not canonical_uuid(attempt_id):\n\
          \                return empty\n            if item_id in task_items or attempt_id\
          \ in attempts:\n                return empty\n            task_items.add(item_id)\n\
          \            attempts.add(attempt_id)\n            slot_mapping.append({\n\
          \                'slot_id': slot['slot_id'],\n                'position':\
          \ position,\n                'image_type': slot['image_type'],\n       \
          \         'task_item_id': item_id,\n                'attempt_id': attempt_id,\n\
          \            })\n        references = submission.get('references')\n   \
          \     if not isinstance(references, list) or not 1 <= len(references) <=\
          \ 4:\n            return empty\n        reference_manifest = []\n      \
          \  for order, reference in enumerate(references, 1):\n            expected_ref_id\
          \ = 'PRIMARY' if order == 1 else 'AUX%02d' % (order - 1)\n            if\
          \ (not isinstance(reference, dict)\n                    or set(reference)\
          \ != {'ref_id', 'order', 'asset_id', 'content_sha256'}\n               \
          \     or reference.get('ref_id') != expected_ref_id\n                  \
          \  or not isinstance(reference.get('order'), int)\n                    or\
          \ isinstance(reference.get('order'), bool)\n                    or reference.get('order')\
          \ != order\n                    or not canonical_uuid(reference.get('asset_id'))\n\
          \                    or not re.fullmatch(r'[0-9a-f]{64}', str(reference.get('content_sha256',\
          \ '')))):\n                return empty\n            reference_manifest.append({\n\
          \                'asset_id': reference['asset_id'],\n                'position':\
          \ order,\n                'content_sha256': reference['content_sha256'],\n\
          \                'ref_id': expected_ref_id,\n            })\n        if\
          \ (canonical_sha256(slot_mapping) != permit['slot_mapping_digest']\n   \
          \             or canonical_sha256(reference_manifest) != permit['reference_manifest_digest']):\n\
          \            return empty\n        return {'ready': 'yes', 'accepted_body':\
          \ json.dumps(\n                    result, ensure_ascii=False, separators=(',',\
          \ ':'), allow_nan=False)}\n    except (TypeError, ValueError, KeyError,\
          \ AttributeError, json.JSONDecodeError, UnicodeEncodeError):\n        return\
          \ empty\n"
        code_language: python3
