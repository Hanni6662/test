    - data:
        code: "\"\"\"Compact product-visual flow. Pure functions embedded into Dify\
          \ Code nodes.\"\"\"\nimport json\nimport re\n\nFIELDS = ['语言种类', '使用的电商平台',\
          \ '使用场景', '视觉风格', '商品卖点']\nGENERATED_FIELD_IDS = ['1', '3', '4', '5']\n\
          PLATFORMS = ['亚马逊主图', '亚马逊高级A+', 'TEMU', 'TEMU服饰类', 'TIKTOK', '淘宝', '京东',\
          \ '拼多多', '1688']\nTYPES = [\n    '品牌导购主视觉', '核心卖点信息图', '生活方式海报', '多场景展示图',\n\
          \    '场景化卖点图', '使用体验图', 'SKU展示图', '细节展示图',\n]\n\nPLATFORM_RULES = {\n  \
          \  '亚马逊主图': '整套采用 1:1。品牌导购主视觉若作为商品首图，使用纯白背景，不添加文字、边框、水印或装饰；其他图片可按职责展示场景、细节与信息层级。',\n\
          \    '亚马逊高级A+': '品牌导购主视觉采用 1464 x 1800 px 纵向沉浸式构图；其余图片采用 1464 x 600 px 横向模块化构图。',\n\
          \    'TEMU': '整套采用 1:1，商品清晰完整且主体突出；按图片职责使用场景、细节与简洁信息表达。',\n    'TEMU服饰类':\
          \ '整套采用 3:4 竖向构图，完整表现服饰轮廓，并为人物动作、穿着状态和场景留出空间。',\n    'TIKTOK': '整套采用 1:1，商品清晰完整；辅助图片强调真实使用、动作感、多角度和快速理解。',\n\
          \    '淘宝': '整套采用 800 x 800 px 方形画布，商品主体清晰、完整、易辨识；避免与商品无关的元素干扰主体。',\n   \
          \ '京东': '整套采用 800 x 800 px 方形画布，商品主体清晰、完整、占据视觉中心；根据图片职责控制场景与信息层级。',\n  \
          \  '拼多多': '整套采用 800 x 800 px 方形画布，商品主体清晰且容易快速识别；装饰与文字不得遮挡商品关键结构。',\n   \
          \ '1688': '整套采用 800 x 800 px 方形画布，以清晰呈现商品外观、结构与可见细节为主；背景与信息表达应服务于供货商品的快速判断。',\n\
          \ }\n\n_AGE_PATTERN = re.compile(r'童装|儿童|女童|男童|婴幼儿|children|\\bchild\\b|\\\
          bkids?\\b', re.I)\n_PERFORMANCE_PATTERN = re.compile(\n    r'\\bUPF\\s*\\\
          d+\\+?\\b|'\n    r'(?:具备|具有|拥有|提供|保证|达到|实现|支持|通过|经过)[^，。；;]{0,24}'\n   \
          \ r'(?:防晒|防紫外线|速干|抗菌|防水|防风|防皱|透气|保暖|吸湿|排汗|阻燃)|'\n    r'(?:防晒|防紫外线|速干|抗菌|防水|防风|防皱|透气|保暖|吸湿|排汗|阻燃)'\n\
          \    r'(?:等级|指数|性能|功能|功效|效果|认证)|'\n    r'\\b(?:guaranteed|certified|rated|provides?|offers?|delivers?)\\\
          b[^,.;]{0,28}'\n    r'(?:UV\\s*protection|waterproof|quick[\\s-]?dry|antibacterial|windproof|breathable|moisture[\\\
          s-]?wicking)',\n    re.I,\n)\n_MATERIAL_PATTERN = re.compile(\n    r'纯棉|全棉|棉质|羊毛|羊绒|涤纶|聚酯|锦纶|尼龙|氨纶|真丝|丝绸|亚麻|'\n\
          \    r'真皮|皮革|PU\\s*皮|金属材质|塑料材质|木质材料|陶瓷材质|玻璃材质|'\n    r'\\bcotton\\b|\\bwool\\\
          b|\\bcashmere\\b|\\bpolyester\\b|\\bnylon\\b|'\n    r'\\bspandex\\b|\\bsilk\\\
          b|\\blinen\\b|\\bleather\\b|made\\s+of\\s+(?:metal|plastic|wood|ceramic|glass)',\n\
          \    re.I,\n)\n_LANGUAGE_PATTERN = re.compile(\n    r'简体中文|繁体中文|中文|英语|英文|中英文|中英双语|英中双语|德语|法语|西班牙语|日语|韩语|阿拉伯语|'\n\
          \    r'无文字|无文案|不放文字|不添加可见文字|不含文字|纯视觉|'\n    r'\\bChinese\\b|\\bEnglish\\\
          b|\\bGerman\\b|\\bFrench\\b|\\bSpanish\\b|'\n    r'\\bJapanese\\b|\\bKorean\\\
          b|\\bArabic\\b|\\bno\\s+(?:text|copy)\\b|\\btext[\\s-]?free\\b',\n    re.I,\n\
          \ )\n_NO_TEXT_PATTERN = re.compile(\n    r'(?:不(?:添加|使用|展示|出现|包含|含有|放置|放入|需要)|无需|禁止添加|避免添加)'\n\
          \    r'[^，。；;]{0,28}(?:可见)?(?:文字|文案|文本|字符|字样|标签)',\n    re.I,\n)\n\n\ndef\
          \ dumps(value):\n    return json.dumps(value, ensure_ascii=False)\n\n\n\
          def read(raw):\n    raw = re.sub(r'^\\x60\\x60\\x60(?:json)?\\s*|\\s*\\\
          x60\\x60\\x60$', '', str(raw or '').strip())\n    require(bool(raw), '模型输出为空')\n\
          \    try:\n        value, end = json.JSONDecoder().raw_decode(raw)\n   \
          \ except json.JSONDecodeError as exc:\n        raise ValueError(f'模型输出不是有效\
          \ JSON：{exc.msg}') from exc\n    tail = raw[end:].strip()\n    if tail.startswith('{'):\n\
          \        try:\n            second, second_end = json.JSONDecoder().raw_decode(tail)\n\
          \        except json.JSONDecodeError as exc:\n            raise ValueError(f'JSON\
          \ 尾部存在不完整对象：{exc.msg}') from exc\n        remainder = tail[second_end:].strip()\n\
          \        require(not remainder.startswith('{'), '模型返回了超过两个 JSON 对象')\n \
          \       can_merge = (\n            isinstance(value, dict) and isinstance(second,\
          \ dict)\n            and isinstance(value.get('images'), list) and isinstance(second.get('images'),\
          \ list)\n        )\n        require(can_merge, '模型返回了两个无法合并的 JSON 对象')\n\
          \        value['images'] = value['images'] + second['images']\n    if not\
          \ isinstance(value, dict):\n        raise ValueError('模型输出必须是 JSON 对象')\n\
          \    return value\n\n\ndef require(condition, message):\n    if not condition:\n\
          \        raise ValueError(message)\n\n\ndef text(value, label, limit=3500):\n\
          \    require(isinstance(value, str) and 0 < len(value.strip()) <= limit,\
          \ label + '缺失或过长')\n    return value.strip()\n\n\ndef validate_field_value(field_id,\
          \ value):\n    key = str(field_id)\n    value = text(value, f'第{key}项内容')\n\
          \    if key == '1':\n        require(_LANGUAGE_PATTERN.search(value) or\
          \ _NO_TEXT_PATTERN.search(value),\n                '第1项必须明确一种图片文字语言或无文字')\n\
          \    if key == '2':\n        require(value in PLATFORMS, '第2项必须选择一个固定平台')\n\
          \    return value\n\n\ndef canvas_for(platform, image_type):\n    require(platform\
          \ in PLATFORMS, '平台选择无效')\n    require(image_type in TYPES, '图片类型无效')\n\
          \    if platform == '亚马逊高级A+':\n        return '1464 x 1800 px' if image_type\
          \ == TYPES[0] else '1464 x 600 px'\n    if platform == 'TEMU服饰类':\n    \
          \    return '3:4'\n    if platform in {'淘宝', '京东', '拼多多', '1688'}:\n   \
          \     return '800 x 800 px'\n    return '1:1'\n\n\ndef build_platform_profile(platform,\
          \ image_types):\n    require(platform in PLATFORMS, '平台选择无效')\n    require(isinstance(image_types,\
          \ list) and image_types, '图片类型选择无效')\n    return {\n        'platform':\
          \ platform,\n        'rule': PLATFORM_RULES[platform],\n        'canvases':\
          \ [{'type': name, 'canvas': canvas_for(platform, name)} for name in image_types],\n\
          \    }\n\n\ndef option_values(field):\n    if str(field.get('id')) == '2':\n\
          \        return [f'PLATFORM|||{name}' for name in PLATFORMS]\n    options\
          \ = field['options']\n    return [f'{letter}|||{value}' for letter, value\
          \ in zip('ABC', options)] + [\n        'D|||由视觉审核 Agent 自由设计',\n       \
          \ 'custom|||自定义',\n    ]\n\n\ndef _saved_option(entry):\n    value = entry.get('value')\
          \ or '由视觉审核 Agent 自由设计'\n    return 'LOCKED|||已保存：' + value\n\n\ndef _choice_options(audit,\
          \ state):\n    selections, issues = state.get('selections', {}), state.get('issues',\
          \ {})\n    result = {}\n    for i, field in enumerate(audit['fields'], 1):\n\
          \        key = str(i)\n        result[f'choice_{i}_options'] = (\n     \
          \       [_saved_option(selections[key])]\n            if key in selections\
          \ and key not in issues\n            else option_values(field)\n       \
          \ )\n    return result\n\n\ndef render_form(audit, state):\n    selections\
          \ = state.get('selections', {})\n    issues = state.get('issues', {})\n\
          \    pending = [str(i) for i in range(1, 6) if str(i) not in selections\
          \ or str(i) in issues]\n    lines = [\n        '## 为商品图注入你的设计偏好',\n    \
          \    audit['summary'],\n        '**用户声明的产品品类**：' + audit['declared_category'],\n\
          \        '**产品保真边界**：' + '；'.join(audit['identity_constraints']),\n    \
          \    '**尚不能从图片确认**：' + ('；'.join(audit['unknowns']) or '无额外记录'),\n     \
          \   '五项是给设计 Agent 的方向参考，不是限制画面质量的硬合同。请选择语言、固定平台、使用场景、视觉风格和商品卖点；选择 D 即授权\
          \ Agent 完成该项。',\n    ]\n    if selections:\n        lines.append('### 已保存的偏好')\n\
          \        for key in map(str, range(1, 6)):\n            if key in selections:\n\
          \                entry = selections[key]\n                lines.append(f\"\
          {key}. {FIELDS[int(key)-1]}：{entry['value'] or 'D · 交给 Agent 设计'}\")\n \
          \   if pending:\n        lines.append('**本次需要填写或修正：' + '、'.join(pending)\
          \ + '。其他项已锁定保留。**')\n    if state.get('message'):\n        lines.append(state['message'])\n\
          \    for key in pending:\n        if key in issues:\n            lines.append(f'第{key}项需修正：{issues[key]}')\n\
          \    lines.append('提交后由 Agent 自主完成构图与八图分工；只有会改变商品本体的要求才会请求修正。')\n    return\
          \ '\\n\\n'.join(lines)\n\n\ndef prepare(raw, primary_files, auxiliary_files,\
          \ product_category):\n    auxiliary_files = [] if auxiliary_files is None\
          \ else auxiliary_files\n    require(isinstance(primary_files, list) and\
          \ len(primary_files) == 1, '请上传且仅上传 1 张主参考图')\n    require(isinstance(auxiliary_files,\
          \ list) and len(auxiliary_files) <= 3, '辅助参考图最多 3 张')\n    category = text(product_category,\
          \ '产品品类', 100)\n    audit = read(raw)\n    audit['declared_category'] =\
          \ category\n    audit['summary'] = text(audit.get('summary'), '商品概述', 1000)\n\
          \    audit['primary_view'] = text(audit.get('primary_view'), '主参考图视角', 300)\n\
          \n    physical = audit.get('physical_profile')\n    require(isinstance(physical,\
          \ dict), '缺少产品物理形态 physical_profile')\n    physical_keys = ['silhouette_proportions',\
          \ 'parts_count', 'openings_connections', 'material_appearance', 'color_zones',\
          \ 'pattern_logo_placement', 'visible_texture']\n    audit['physical_profile']\
          \ = {\n        key: text(physical.get(key), f'物理形态 {key}', 900) for key\
          \ in physical_keys\n    }\n\n    expected_aux_ids = [f'AUX{i:02d}' for i\
          \ in range(1, len(auxiliary_files) + 1)]\n    relations = audit.get('auxiliary_relations')\n\
          \    relations = relations if isinstance(relations, list) else []\n    by_id\
          \ = {}\n    for item in relations:\n        if not isinstance(item, dict):\n\
          \            continue\n        match = re.fullmatch(r'AUX[ _-]*0*([1-3])',\
          \ str(item.get('id', '')).upper())\n        if match:\n            key =\
          \ f'AUX{int(match.group(1)):02d}'\n            by_id[key] = item if key\
          \ not in by_id else {}\n    checked_relations = []\n    for expected_id\
          \ in expected_aux_ids:\n        item = by_id.get(expected_id, {})\n    \
          \    valid = item.get('relation') in ['confirm', 'supplement', 'ignored_conflict']\
          \ and bool(item.get('evidence'))\n        checked_relations.append({\n \
          \           'id': expected_id,\n            'view': str(item.get('view')\
          \ or 'unknown')[:120],\n            'relation': item['relation'] if valid\
          \ else 'ignored_conflict',\n            'scope': item.get('scope') if item.get('scope')\
          \ in ['global','front_only','back_only','side_only','detail_only'] else\
          \ 'detail_only',\n            'evidence': str(item.get('evidence') or '未能可靠确认此辅助图，仅使用主参考图')[:500],\n\
          \        })\n    audit['auxiliary_relations'] = checked_relations\n    audit['asset_ids']\
          \ = {'primary': 'PRIMARY', 'auxiliary': expected_aux_ids}\n\n    locks =\
          \ audit.get('identity_constraints')\n    require(isinstance(locks, list)\
          \ and 3 <= len(locks) <= 8, '产品一致性约束需有 3–8 条')\n    audit['identity_constraints']\
          \ = [text(item, '一致性约束', 450) for item in locks]\n    audit['identity_prompt']\
          \ = text(audit.get('identity_prompt'), '英文产品保真提示词', 3500)\n    require(isinstance(audit.get('unknowns'),\
          \ list), '缺少未知信息列表')\n    audit['unknowns'] = [text(item, '未知信息', 300) for\
          \ item in audit['unknowns']]\n\n    generated = audit.get('fields')\n  \
          \  require(isinstance(generated, list) and [str(item.get('id')) for item\
          \ in generated] == GENERATED_FIELD_IDS,\n            '模型只需按顺序生成第1、3、4、5项')\n\
          \    checked_fields = []\n    for field in generated:\n        key = str(field['id'])\n\
          \        options = field.get('options')\n        require(isinstance(options,\
          \ list) and len(options) == 3, f'第{key}项必须有三个示例')\n        checked = [validate_field_value(key,\
          \ text(item, f'第{key}项示例', 900)) for item in options]\n        require(len(set(checked))\
          \ == 3, f'第{key}项示例不能重复')\n        checked_fields.append({'id': key, 'options':\
          \ checked})\n    audit['fields'] = [checked_fields[0], {'id': '2', 'options':\
          \ list(PLATFORMS)}, *checked_fields[1:]]\n\n    state = {'selections': {},\
          \ 'issues': {}, 'status': 'pending', 'message': ''}\n    result = {'audit':\
          \ dumps(audit), 'state': dumps(state), 'display': render_form(audit, state),\
          \ 'image_types': dumps(TYPES)}\n    result.update(_choice_options(audit,\
          \ state))\n    return result\n\n\ndef inspect_audit(raw, primary_files,\
          \ auxiliary_files, product_category):\n    try:\n        prepare(raw, primary_files,\
          \ auxiliary_files, product_category)\n        return {'ok': 'yes', 'raw':\
          \ raw, 'message': ''}\n    except (ValueError, TypeError, KeyError, IndexError)\
          \ as exc:\n        return {'ok': 'no', 'raw': raw, 'message': str(exc)}\n\
          \n\ndef apply_form(state_raw, audit_raw, choices, customs, image_types=None):\n\
          \    state, audit = read(state_raw), read(audit_raw)\n    if image_types\
          \ is not None:\n        selected = json.loads(image_types)\n        require(isinstance(selected,\
          \ list) and selected and all(item in TYPES for item in selected)\n     \
          \           and len(set(selected)) == len(selected), '请至少选择一种商品图类型')\n \
          \       state['image_types'] = [name for name in TYPES if name in selected]\n\
          \    require(isinstance(choices, list) and len(choices) == 5, '必须提交五项结构化选择')\n\
          \    require(isinstance(customs, list) and len(customs) == 5, '必须提交五项自定义文本状态')\n\
          \    selections = state.setdefault('selections', {})\n    issues = state.setdefault('issues',\
          \ {})\n    for i, (field, raw_choice, raw_custom) in enumerate(zip(audit['fields'],\
          \ choices, customs), 1):\n        key = str(i)\n        allowed = [_saved_option(selections[key])]\
          \ if key in selections and key not in issues else option_values(field)\n\
          \        require(isinstance(raw_choice, str) and raw_choice in allowed,\
          \ f'第{i}项选择不在当前允许选项中')\n        if raw_choice.startswith('LOCKED|||'):\n\
          \            continue\n        mode, encoded = raw_choice.split('|||', 1)\n\
          \        if key == '2':\n            require(mode == 'PLATFORM' and encoded\
          \ in PLATFORMS, '第2项必须选择固定平台')\n            entry = {'mode': 'PLATFORM',\
          \ 'value': encoded}\n        elif mode in 'ABC' and len(mode) == 1:\n  \
          \          entry = {'mode': mode, 'value': field['options']['ABC'.index(mode)]}\n\
          \        elif mode == 'D':\n            entry = {'mode': 'D', 'value': ''}\n\
          \        else:\n            if not isinstance(raw_custom, str) or not raw_custom.strip()\
          \ or len(raw_custom) > 3500:\n                issues[key] = '请填写非空且不超过 3500\
          \ 字的自定义内容。'\n                continue\n            try:\n              \
          \  custom_value = validate_field_value(key, raw_custom)\n            except\
          \ ValueError as exc:\n                issues[key] = str(exc)\n         \
          \       continue\n            entry = {'mode': 'custom', 'value': custom_value}\n\
          \        selections[key] = entry\n        issues.pop(key, None)\n    complete\
          \ = len(selections) == 5 and not issues\n    state['status'] = 'checking'\
          \ if complete else 'pending'\n    state['message'] = '' if complete else\
          \ '请只修正仍待填写或存在商品身份冲突的项目。'\n    return {'state': dumps(state), 'complete':\
          \ 'yes' if complete else 'no'}\n\n\ndef parse_reply(reply, state_raw, audit_raw):\n\
          \    \"\"\"Legacy numbered-text parser kept for compatibility; the Studio\
          \ DSL does not call it.\"\"\"\n    state, audit = read(state_raw), read(audit_raw)\n\
          \    reply = str(reply or '').strip()\n    pattern = r'(?:^|[\\n;；]+)\\\
          s*([1-5１-５])\\s*[.．、:：)）=\\-]?\\s*'\n    matches = list(re.finditer(pattern,\
          \ reply))\n    errors, seen = [], set()\n    if not matches or reply[:matches[0].start()].strip():\n\
          \        errors.append('请按“编号 + 选项或自定义内容”填写。')\n    for j, match in enumerate(matches):\n\
          \        key = str(int(match.group(1)))\n        value = reply[match.end():matches[j\
          \ + 1].start() if j + 1 < len(matches) else len(reply)].strip()\n      \
          \  if key in seen:\n            state['issues'][key] = '同一回复出现重复选择，请重新指定一个。'\n\
          \            continue\n        seen.add(key)\n        if key == '2' and\
          \ value in PLATFORMS:\n            entry = {'mode': 'PLATFORM', 'value':\
          \ value}\n        else:\n            chosen = value.upper().strip()\n  \
          \          if chosen in 'ABCD' and len(chosen) == 1 and key != '2':\n  \
          \              field = audit['fields'][int(key) - 1]\n                entry\
          \ = {'mode': chosen, 'value': field['options']['ABC'.index(chosen)] if chosen\
          \ != 'D' else ''}\n            else:\n                custom = re.sub(r'^(?:自定义|自訂|自定)\\\
          s*[:：]?\\s*', '', value).strip()\n                try:\n               \
          \     entry = {'mode': 'custom', 'value': validate_field_value(key, custom)}\n\
          \                except ValueError as exc:\n                    state['issues'][key]\
          \ = str(exc)\n                    continue\n        state['selections'][key]\
          \ = entry\n        state['issues'].pop(key, None)\n    state['message']\
          \ = '\\n'.join(errors)\n    complete = len(state['selections']) == 5 and\
          \ not state['issues'] and not errors\n    state['status'] = 'checking' if\
