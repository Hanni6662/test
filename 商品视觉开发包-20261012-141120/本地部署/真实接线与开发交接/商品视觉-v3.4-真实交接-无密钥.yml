    - data:
        code: "import hashlib\nimport json\nimport re\nimport uuid\n\n\ndef load(value):\n\
          \    return json.loads(value) if isinstance(value, str) else value\n\n\n\
          def main(context_body, context_status_code, start_context_raw, workflow_run_id,\
          \ parse_state_raw, complete):\n    empty = {\n        'ready': 'no', 'body':\
          \ '{}', 'business_session_id': '',\n        'recommendation_id': '', 'recommendation_revision':\
          \ '', 'task_id': '',\n        'submission_id': '', 'run_id': '', 'event_key':\
          \ '',\n    }\n    try:\n        context = load(context_body)\n        start_context\
          \ = load(start_context_raw)\n        state = load(parse_state_raw)\n   \
          \     status_code = int(context_status_code)\n        if status_code !=\
          \ 200 or not isinstance(context, dict) or not isinstance(start_context,\
          \ dict):\n            return empty\n        if context.get('contract_version')\
          \ != 'visual-v34-stage-v1':\n            return empty\n        if context.get('flow_version')\
          \ != 'visual-v3.4-single-selection' or context.get('phase') != 'selection':\n\
          \            return empty\n        if context.get('selection_status') not\
          \ in {'pending', 'unknown', 'accepted'} or complete != 'yes':\n        \
          \    return empty\n        session_id = str(uuid.UUID(context.get('business_session_id',\
          \ '')))\n        recommendation_id = str(uuid.UUID(context.get('recommendation_id',\
          \ '')))\n        task_id = str(uuid.UUID(context.get('task_id', '')))\n\
          \        submission_id = str(uuid.UUID(context.get('selection_submission_id',\
          \ '')))\n        if str(uuid.UUID(start_context.get('business_session_id',\
          \ ''))) != session_id:\n            return empty\n        if not isinstance(workflow_run_id,\
          \ str) or not re.fullmatch(r'[A-Za-z0-9_.:-]{1,320}', workflow_run_id):\n\
          \            return empty\n        if context.get('dify_run_id') != workflow_run_id:\n\
          \            return empty\n        revision = context.get('recommendation_revision')\n\
          \        if isinstance(revision, bool) or not isinstance(revision, int)\
          \ or revision < 1:\n            return empty\n        if not isinstance(state,\
          \ dict) or not isinstance(state.get('selections'), dict):\n            return\
          \ empty\n        selections = state['selections']\n        if set(selections)\
          \ != {'1', '2', '3', '4', '5'} or state.get('issues'):\n            return\
          \ empty\n        image_types = state.get('image_types')\n        if not\
          \ isinstance(image_types, list) or not 1 <= len(image_types) <= 8:\n   \
          \         return empty\n        if any(not isinstance(item, str) or not\
          \ item for item in image_types) or len(set(image_types)) != len(image_types):\n\
          \            return empty\n\n        preferences = {}\n        for field_id,\
          \ name in (('1', 'language'), ('3', 'usage_scene'), ('4', 'visual_style'),\
          \ ('5', 'selling_points')):\n            entry = selections[field_id]\n\
          \            if not isinstance(entry, dict):\n                return empty\n\
          \            mode, value = entry.get('mode'), entry.get('value')\n     \
          \       if mode in {'A', 'B', 'C', 'D'}:\n                preferences[name]\
          \ = {'mode': mode}\n            elif mode == 'custom' and isinstance(value,\
          \ str) and value.strip():\n                preferences[name] = {'mode':\
          \ 'custom', 'text': value}\n            else:\n                return empty\n\
          \        platform_entry = selections['2']\n        if not isinstance(platform_entry,\
          \ dict) or platform_entry.get('mode') != 'PLATFORM':\n            return\
          \ empty\n        platform = platform_entry.get('value')\n        if not\
          \ isinstance(platform, str) or not platform:\n            return empty\n\
          \        preferences['platform'] = platform\n\n        event = {\n     \
          \       'contract_version': 'visual-v34-stage-v1',\n            'flow_version':\
          \ 'visual-v3.4-single-selection',\n            'business_session_id': session_id,\n\
          \            'recommendation_id': recommendation_id,\n            'recommendation_revision':\
          \ revision,\n            'dify_run_id': workflow_run_id,\n            'node_id':\
          \ 'parse_0',\n            'event_key': 'selection:' + submission_id,\n \
          \           'digest_version': 1,\n            'event_type': 'selection.applied',\n\
          \            'payload': {\n                'selection_submission_id': submission_id,\n\
          \                'parse_state': {'preferences': preferences, 'image_types':\
          \ image_types},\n            },\n        }\n        canonical = json.dumps(event,\
          \ sort_keys=True, separators=(',', ':'), ensure_ascii=False, allow_nan=False)\n\
          \        event['digest'] = hashlib.sha256(canonical.encode('utf-8')).hexdigest()\n\
          \        return {\n            'ready': 'yes',\n            'body': json.dumps(event,\
          \ separators=(',', ':'), ensure_ascii=False, allow_nan=False),\n       \
          \     'business_session_id': session_id,\n            'recommendation_id':\
          \ recommendation_id,\n            'recommendation_revision': str(revision),\n\
          \            'task_id': task_id,\n            'submission_id': submission_id,\n\
          \            'run_id': workflow_run_id,\n            'event_key': event['event_key'],\n\
          \        }\n    except (TypeError, ValueError, KeyError, json.JSONDecodeError):\n\
          \        return empty\n"
