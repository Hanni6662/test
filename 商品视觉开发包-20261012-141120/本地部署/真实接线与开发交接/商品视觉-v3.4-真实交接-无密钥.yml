    - data:
        code: "import hashlib\nimport json\nimport re\nimport uuid\nfrom datetime\
          \ import datetime, timezone\n\nPREF_KEYS = {'1': 'language', '3': 'usage_scene',\
          \ '4': 'visual_style', '5': 'selling_points'}\nREF_IDS = ['PRIMARY', 'AUX01',\
          \ 'AUX02', 'AUX03']\n\ndef obj(value):\n    value = json.loads(value) if\
          \ isinstance(value, str) else value\n    if not isinstance(value, dict):\n\
          \        raise ValueError('expected object')\n    return value\n\ndef valid_uuid(value):\n\
          \    return isinstance(value, str) and str(uuid.UUID(value)) == value\n\n\
          def main(context_body, context_status_code, package_raw, workflow_run_id):\n\
          \    empty = {'ready': 'no', 'body': '{}', 'task_id': '', 'submission_id':\
          \ '',\n             'package_digest': '', 'image_types': '[]'}\n    try:\n\
          \        context = obj(context_body)\n        package = obj(package_raw)\n\
          \        if int(context_status_code) != 200:\n            return empty\n\
          \        if (context.get('contract_version') != 'visual-v34-stage-v1'\n\
          \                or context.get('flow_version') != 'visual-v3.4-single-selection'\n\
          \                or context.get('phase') != 'prompt'\n                or\
          \ context.get('selection_status') != 'accepted'\n                or context.get('dify_run_id')\
          \ != workflow_run_id):\n            return empty\n        for key in ('business_session_id',\
          \ 'recommendation_id', 'task_id',\n                    'selection_submission_id',\
          \ 'prompt_submission_id'):\n            if not valid_uuid(context.get(key)):\n\
          \                return empty\n        expected_submission = str(uuid.uuid5(\n\
          \            uuid.UUID(context['selection_submission_id']), 'chatflow-prompt-package-v1'))\n\
          \        if context['prompt_submission_id'] != expected_submission:\n  \
          \          return empty\n        expires = datetime.fromisoformat(str(context.get('expires_at',\
          \ '')).replace('Z', '+00:00'))\n        if expires.tzinfo is None or expires.astimezone(timezone.utc)\
          \ <= datetime.now(timezone.utc):\n            return empty\n        if set(package)\
          \ != {'basis', 'images'} or not isinstance(package['basis'], dict):\n  \
          \          return empty\n        basis = package['basis']\n        images\
          \ = package['images']\n        image_types = context.get('image_types')\n\
          \        if (not isinstance(image_types, list) or not 1 <= len(image_types)\
          \ <= 8\n                or context.get('selection', {}).get('image_types')\
          \ != image_types\n                or basis.get('image_types') != image_types\n\
          \                or not isinstance(images, list)\n                or [item.get('type')\
          \ if isinstance(item, dict) else None for item in images] != image_types):\n\
          \            return empty\n        refs = context.get('references')\n  \
          \      if not isinstance(refs, list) or not 1 <= len(refs) <= 4:\n     \
          \       return empty\n        expected_refs = REF_IDS[:len(refs)]\n    \
          \    if ([item.get('ref_id') for item in refs] != expected_refs\n      \
          \          or [item.get('order') for item in refs] != list(range(1, len(refs)\
          \ + 1))\n                or any(not valid_uuid(item.get('asset_id'))\n \
          \                      or not re.fullmatch(r'[0-9a-f]{64}', str(item.get('content_sha256',\
          \ '')))\n                       for item in refs)):\n            return\
          \ empty\n        auxiliary = expected_refs[1:]\n        assets = basis.get('asset_ids')\n\
          \        if not isinstance(assets, dict) or assets.get('primary') != 'PRIMARY'\
          \ or assets.get('auxiliary') != auxiliary:\n            return empty\n \
          \       recommendation = context.get('original_recommendation')\n      \
          \  resolved = context.get('resolved_preferences')\n        form = basis.get('preference_form')\n\
          \        if not isinstance(recommendation, dict) or not isinstance(resolved,\
          \ dict) or not isinstance(form, dict):\n            return empty\n     \
          \   if set(form) != {'1', '2', '3', '4', '5'}:\n            return empty\n\
          \        for key, field_name in PREF_KEYS.items():\n            saved =\
          \ resolved.get(field_name)\n            submitted = form.get(key)\n    \
          \        if not isinstance(saved, dict) or not isinstance(submitted, dict):\n\
          \                return empty\n            mode = saved.get('mode')\n  \
          \          if mode in {'A', 'B', 'C'}:\n                choices = recommendation.get('field_texts',\
          \ {}).get(field_name)\n                index = ord(mode) - ord('A')\n  \
          \              if (saved.get('source') != 'recommendation_original'\n  \
          \                      or saved.get('recommendation_revision') != context.get('recommendation_revision')\n\
          \                        or not isinstance(choices, list) or len(choices)\
          \ != 3\n                        or saved.get('text') != choices[index]\n\
          \                        or submitted.get('source') != mode\n          \
          \              or submitted.get('value') != choices[index]):\n         \
          \           return empty\n            elif mode == 'custom':\n         \
          \       if (not isinstance(saved.get('text'), str)\n                   \
          \     or submitted.get('source') != 'custom'\n                        or\
          \ submitted.get('value') != saved.get('text')):\n                    return\
          \ empty\n            elif mode == 'D':\n                if (saved.get('kind')\
          \ != 'agent_design' or submitted.get('source') != 'D'\n                \
          \        or not isinstance(submitted.get('value'), str)\n              \
          \          or not submitted['value'].strip()):\n                    return\
          \ empty\n            else:\n                return empty\n        platform\
          \ = resolved.get('platform')\n        if (not isinstance(platform, dict)\
          \ or platform.get('mode') != 'platform'\n                or form['2'].get('source')\
          \ != 'PLATFORM'\n                or form['2'].get('value') != platform.get('value')):\n\
          \            return empty\n        for image in images:\n            plan\
          \ = image.get('reference_plan') if isinstance(image, dict) else None\n \
          \           if (not isinstance(plan, dict) or plan.get('identity_anchor_id')\
          \ != 'PRIMARY'\n                    or plan.get('view_reference_ids') !=\
          \ auxiliary\n                    or plan.get('excluded_reference_ids') !=\
          \ []):\n                return empty\n        package_digest = hashlib.sha256(json.dumps(\n\
          \            package, ensure_ascii=False, sort_keys=True, separators=(',',\
          \ ':'), allow_nan=False\n        ).encode('utf-8')).hexdigest()\n      \
          \  submission = {\n            'contract_version': 'chatflow-handoff-v1',\n\
          \            'business_session_id': context['business_session_id'],\n  \
          \          'recommendation_id': context['recommendation_id'],\n        \
          \    'recommendation_revision': context['recommendation_revision'],\n  \
          \          'dify_run_id': workflow_run_id,\n            'task_id': context['task_id'],\n\
          \            'submission_id': context['prompt_submission_id'],\n       \
          \     'package_version': 'chatflow-prompt-package-v1',\n            'package_digest_version':\
          \ 1,\n            'package_digest': package_digest,\n            'image_types':\
          \ image_types,\n            'references': refs,\n            'prompt_package':\
          \ package,\n        }\n        return {'ready': 'yes', 'body': json.dumps(\n\
          \                    submission, ensure_ascii=False, separators=(',', ':'),\
          \ allow_nan=False),\n                'task_id': context['task_id'], 'submission_id':\
          \ context['prompt_submission_id'],\n                'package_digest': package_digest,\n\
          \                'image_types': json.dumps(image_types, ensure_ascii=False,\
          \ separators=(',', ':'))}\n    except (TypeError, ValueError, KeyError,\
          \ AttributeError, json.JSONDecodeError):\n        return empty\n"
