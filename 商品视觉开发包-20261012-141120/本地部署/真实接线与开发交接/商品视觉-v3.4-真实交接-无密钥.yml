          \    return json.loads(value) if isinstance(value, str) else value\n\n\n\
          def main(backend_context_raw, workflow_run_id, review_state_raw, approved):\n\
          \    empty = {'ready': 'no', 'body': '{}', 'business_session_id': '', 'event_key':\
          \ ''}\n    try:\n        context = load(backend_context_raw)\n        state\
          \ = load(review_state_raw)\n        if not isinstance(context, dict) or\
          \ not isinstance(state, dict) or approved != 'no':\n            return empty\n\
          \        if context.get('contract_version') != 'visual-v34-stage-v1':\n\
          \            return empty\n        if context.get('flow_version') != 'visual-v3.4-single-selection':\n\
          \            return empty\n        session_id = str(uuid.UUID(context.get('business_session_id',\
          \ '')))\n        recommendation_id = str(uuid.UUID(context.get('recommendation_id',\
          \ '')))\n        uuid.UUID(context.get('start_operation_id', ''))\n    \
          \    revision = context.get('recommendation_revision')\n        if isinstance(revision,\
          \ bool) or not isinstance(revision, int) or revision < 1:\n            return\
          \ empty\n        if not isinstance(workflow_run_id, str) or not re.fullmatch(r'[A-Za-z0-9_.:-]{1,320}',\
          \ workflow_run_id):\n            return empty\n        if not isinstance(state.get('selections'),\
          \ dict) or set(state['selections']) != {'1', '2', '3', '4', '5'}:\n    \
          \        return empty\n        issues = state.get('issues')\n        if\
          \ not isinstance(issues, dict) or not issues or not set(issues) <= {'3',\
          \ '4', '5'}:\n            return empty\n        if any(not isinstance(value,\
          \ str) or not value.strip() for value in issues.values()):\n           \
          \ return empty\n        fields = sorted(issues, key=int)\n        event_key\
          \ = 'pre_generation.incomplete:' + hashlib.sha256(workflow_run_id.encode('utf-8')).hexdigest()\n\
          \        event = {\n            'contract_version': 'visual-v34-stage-v1',\n\
          \            'flow_version': 'visual-v3.4-single-selection',\n         \
          \   'business_session_id': session_id,\n            'recommendation_id':\
          \ recommendation_id,\n            'recommendation_revision': revision,\n\
          \            'dify_run_id': workflow_run_id,\n            'node_id': 'ready_0',\n\
          \            'event_key': event_key,\n            'digest_version': 1,\n\
          \            'event_type': 'pre_generation.incomplete',\n            'payload':\
          \ {\n                'reason_code': 'PRODUCT_IDENTITY_CONFLICT',\n     \
