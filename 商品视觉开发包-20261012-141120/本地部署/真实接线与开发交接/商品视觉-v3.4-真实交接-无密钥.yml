          \ 'image_types': dumps(TYPES)}\n    result.update(_choice_options(audit,\
          \ state))\n    return result\n\n\ndef inspect_audit(raw, primary_files,\
          \ auxiliary_files, product_category):\n    try:\n        prepare(raw, primary_files,\
          \ auxiliary_files, product_category)\n        return {'ok': 'yes', 'raw':\
          \ raw, 'message': ''}\n    except (ValueError, TypeError, KeyError, IndexError)\
          \ as exc:\n        return {'ok': 'no', 'raw': raw, 'message': str(exc)}\n\
          \n\ndef apply_form(state_raw, audit_raw, choices, customs, image_types=None):\n\
          \    state, audit = read(state_raw), read(audit_raw)\n    if image_types\
          \ is not None:\n        selected = json.loads(image_types)\n        require(isinstance(selected,\
          \ list) and selected and all(item in TYPES for item in selected)\n     \
          \           and len(set(selected)) == len(selected), '请至少选择一种商品图类型')\n \
          \       state['image_types'] = [name for name in TYPES if name in selected]\n\
          \    require(isinstance(choices, list) and len(choices) == 5, '必须提交五项结构化选择')\n\
          \    require(isinstance(customs, list) and len(customs) == 5, '必须提交五项自定义文本状态')\n\
          \    selections = state.setdefault('selections', {})\n    issues = state.setdefault('issues',\
          \ {})\n    for i, (field, raw_choice, raw_custom) in enumerate(zip(audit['fields'],\
          \ choices, customs), 1):\n        key = str(i)\n        allowed = [_saved_option(selections[key])]\
          \ if key in selections and key not in issues else option_values(field)\n\
          \        require(isinstance(raw_choice, str) and raw_choice in allowed,\
          \ f'第{i}项选择不在当前允许选项中')\n        if raw_choice.startswith('LOCKED|||'):\n\
          \            continue\n        mode, encoded = raw_choice.split('|||', 1)\n\
          \        if key == '2':\n            require(mode == 'PLATFORM' and encoded\
          \ in PLATFORMS, '第2项必须选择固定平台')\n            entry = {'mode': 'PLATFORM',\
          \ 'value': encoded}\n        elif mode in 'ABC' and len(mode) == 1:\n  \
          \          entry = {'mode': mode, 'value': field['options']['ABC'.index(mode)]}\n\
          \        elif mode == 'D':\n            entry = {'mode': 'D', 'value': ''}\n\
          \        else:\n            if not isinstance(raw_custom, str) or not raw_custom.strip()\
          \ or len(raw_custom) > 3500:\n                issues[key] = '请填写非空且不超过 3500\
          \ 字的自定义内容。'\n                continue\n            try:\n              \
          \  custom_value = validate_field_value(key, raw_custom)\n            except\
          \ ValueError as exc:\n                issues[key] = str(exc)\n         \
          \       continue\n            entry = {'mode': 'custom', 'value': custom_value}\n\
          \        selections[key] = entry\n        issues.pop(key, None)\n    complete\
          \ = len(selections) == 5 and not issues\n    state['status'] = 'checking'\
          \ if complete else 'pending'\n    state['message'] = '' if complete else\
          \ '请只修正仍待填写或存在商品身份冲突的项目。'\n    return {'state': dumps(state), 'complete':\
          \ 'yes' if complete else 'no'}\n\n\ndef parse_reply(reply, state_raw, audit_raw):\n\
          \    \"\"\"Legacy numbered-text parser kept for compatibility; the Studio\
          \ DSL does not call it.\"\"\"\n    state, audit = read(state_raw), read(audit_raw)\n\
          \    reply = str(reply or '').strip()\n    pattern = r'(?:^|[\\n;；]+)\\\
          s*([1-5１-５])\\s*[.．、:：)）=\\-]?\\s*'\n    matches = list(re.finditer(pattern,\
          \ reply))\n    errors, seen = [], set()\n    if not matches or reply[:matches[0].start()].strip():\n\
          \        errors.append('请按“编号 + 选项或自定义内容”填写。')\n    for j, match in enumerate(matches):\n\
          \        key = str(int(match.group(1)))\n        value = reply[match.end():matches[j\
          \ + 1].start() if j + 1 < len(matches) else len(reply)].strip()\n      \
          \  if key in seen:\n            state['issues'][key] = '同一回复出现重复选择，请重新指定一个。'\n\
          \            continue\n        seen.add(key)\n        if key == '2' and\
          \ value in PLATFORMS:\n            entry = {'mode': 'PLATFORM', 'value':\
          \ value}\n        else:\n            chosen = value.upper().strip()\n  \
          \          if chosen in 'ABCD' and len(chosen) == 1 and key != '2':\n  \
          \              field = audit['fields'][int(key) - 1]\n                entry\
          \ = {'mode': chosen, 'value': field['options']['ABC'.index(chosen)] if chosen\
          \ != 'D' else ''}\n            else:\n                custom = re.sub(r'^(?:自定义|自訂|自定)\\\
          s*[:：]?\\s*', '', value).strip()\n                try:\n               \
          \     entry = {'mode': 'custom', 'value': validate_field_value(key, custom)}\n\
          \                except ValueError as exc:\n                    state['issues'][key]\
          \ = str(exc)\n                    continue\n        state['selections'][key]\
          \ = entry\n        state['issues'].pop(key, None)\n    state['message']\
          \ = '\\n'.join(errors)\n    complete = len(state['selections']) == 5 and\
          \ not state['issues'] and not errors\n    state['status'] = 'checking' if\
          \ complete else 'pending'\n    return {'state': dumps(state), 'complete':\
          \ 'yes' if complete else 'no'}\n\n\ndef resolve(raw, state_raw):\n    state,\
          \ result = read(state_raw), read(raw)\n    require(len(state['selections'])\
          \ == 5, '未确认五项，不得生成')\n    conflicts = result.get('conflicts')\n    auto\
          \ = result.get('auto_values')\n    require(isinstance(conflicts, list) and\
          \ isinstance(auto, dict), '审核结果格式错误')\n    issues = {}\n    for item in\
          \ conflicts:\n        if item.get('kind') != 'identity':\n            continue\n\
          \        keys = item.get('fields')\n        reason = text(item.get('reason'),\
          \ '冲突说明', 800)\n        require(isinstance(keys, list) and keys, '商品身份冲突必须指出具体字段')\n\
          \        for key in map(str, keys):\n            require(key in state['selections'],\
          \ '冲突字段编号无效')\n            if key in {'3', '4', '5'}:\n                issues[key]\
          \ = reason\n    state['issues'] = issues\n    state['message'] = '只需修改下列会改变商品本体的要求；其他偏好已经保留。'\
          \ if issues else ''\n    if issues:\n        state['status'] = 'pending'\n\
          \        return {'state': dumps(state)}\n\n    expected = {key for key,\
          \ entry in state['selections'].items() if entry['mode'] == 'D'}\n    require(set(auto)\
          \ == expected, 'Agent 只能设计用户选择 D 的字段')\n    approved_form = {}\n    for\
          \ key, entry in state['selections'].items():\n        value = text(auto[key],\
          \ '自由设计内容') if entry['mode'] == 'D' else entry['value']\n        if key\
          \ == '1' and entry['mode'] == 'D' and not (_LANGUAGE_PATTERN.search(value)\
          \ or _NO_TEXT_PATTERN.search(value)):\n            value = '无文字：纯视觉商业表达'\n\
          \        value = validate_field_value(key, value)\n        approved_form[key]\
          \ = {'name': FIELDS[int(key) - 1], 'source': entry['mode'], 'value': value}\n\
          \    state['approved_form'] = approved_form\n    state['status'] = 'approved'\n\
          \    return {'state': dumps(state)}\n \n\ndef pack_state(state_raw, audit_raw):\n\
          \    state, audit = read(state_raw), read(audit_raw)\n    result = {\n \
          \       'state': state_raw,\n        'status': state['status'],\n      \
          \  'display': render_form(audit, state) if state['status'] == 'pending'\
          \ else '偏好已确认，正在生成所选图片提示词。',\n        'image_types': dumps(state.get('image_types',\
          \ TYPES)),\n    }\n    result.update(_choice_options(audit, state))\n  \
          \  return result\n\n\ndef basis(state_raw, audit_raw):\n    state, audit\
          \ = read(state_raw), read(audit_raw)\n    approved = state.get('status')\
          \ == 'approved'\n    image_types = state.get('image_types', TYPES)\n   \
          \ approved_form = state.get('approved_form', {})\n    platform = approved_form.get('2',\
          \ {}).get('value')\n    package = {\n        'product': audit['summary'],\n\
          \        'declared_category': audit['declared_category'],\n        'primary_view':\
          \ audit['primary_view'],\n        'physical_profile': audit['physical_profile'],\n\
          \        'auxiliary_relations': audit['auxiliary_relations'],\n        'asset_ids':\
          \ audit['asset_ids'],\n        'identity_constraints': audit['identity_constraints'],\n\
          \        'identity_prompt': audit['identity_prompt'],\n        'unknowns':\
          \ audit['unknowns'],\n        'preference_form': approved_form,\n      \
          \  'image_types': image_types,\n        'platform_profile': build_platform_profile(platform,\
          \ image_types) if approved else {},\n    }\n    message = (\n        '任务已停止，没有生成提示词。'\n\
          \        if state.get('status') == 'cancelled'\n        else '两次补问后仍有会改变商品本体的要求，请重新开始。'\n\
          \    )\n    return {'ok': 'yes' if approved else 'no', 'package': dumps(package)\
          \ if approved else '', 'message': message}\n\n\ndef deliver(raw, package_raw):\n\
          \    result, package = read(raw), read(package_raw)\n    images = result.get('images')\n\
          \    selected = package.get('image_types')\n    profile = package.get('platform_profile')\n\
          \    require(isinstance(selected, list) and selected and all(name in TYPES\
          \ for name in selected), '图片类型选择无效')\n    require(isinstance(profile, dict)\
          \ and profile.get('platform') in PLATFORMS, '缺少平台画布预设')\n    expected_canvases\
          \ = profile.get('canvases')\n    require(isinstance(expected_canvases, list)\
          \ and len(expected_canvases) == len(selected), '平台画布数量无效')\n    require(isinstance(images,\
          \ list) and len(images) == len(selected), '输出数量必须与所选图片类型一致')\n    known_aux\
          \ = set(package.get('asset_ids', {}).get('auxiliary', []))\n    parts =\
          \ [\n        f'# 商品图提示词（{len(selected)} 张）',\n        f\"平台：{profile['platform']}。五项表单是设计偏好；PRIMARY\
          \ 与物理形态是商品一致性底线。\",\n    ]\n    for i, (item, name, expected) in enumerate(zip(images,\
          \ selected, expected_canvases), 1):\n        require(item.get('type') ==\
          \ name == expected.get('type'), f'第{i}张图类型或顺序不正确')\n        canvas = text(item.get('canvas'),\
          \ f'{name}画布规格', 100)\n        require(canvas == expected.get('canvas'),\
          \ f'{name}画布必须为 {expected.get(\"canvas\")}')\n        design = text(item.get('design_prompt'),\
          \ f'{name}设计提示词', 16000)\n        resources = item.get('resources')\n  \
          \      require(isinstance(resources, list) and resources, name + '缺少偏好使用记录')\n\
          \        used_fields = set()\n        for resource in resources:\n     \
          \       require(isinstance(resource, dict), '偏好使用记录格式错误')\n            key\
          \ = str(resource.get('field'))\n            require(key in package['preference_form'],\
          \ '偏好字段无效')\n            text(resource.get('use'), '偏好使用方式', 1200)\n   \
          \         used_fields.add(key)\n        require({'1', '2'} <= used_fields,\
          \ name + '的 resources 必须包含字段1和字段2')\n\n        plan = item.get('reference_plan')\n\
          \        require(isinstance(plan, dict), name + '缺少 reference_plan')\n \
          \       require(plan.get('identity_anchor_id') == 'PRIMARY', name + '必须以\
          \ PRIMARY 为商品身份主锚点')\n        view_ids = plan.get('view_reference_ids')\n\
          \        excluded_ids = plan.get('excluded_reference_ids')\n        require(isinstance(view_ids,\
          \ list) and all(isinstance(x, str) for x in view_ids), name + '补充参考图列表无效')\n\
          \        require(isinstance(excluded_ids, list) and all(isinstance(x, str)\
          \ for x in excluded_ids), name + '排除参考图列表无效')\n        require(len(view_ids)\
          \ == len(set(view_ids)) and len(excluded_ids) == len(set(excluded_ids)),\
          \ name + '参考图 ID 不得重复')\n        require(set(view_ids).isdisjoint(excluded_ids),\
          \ name + '补充图与排除图不能重叠')\n        require(set(view_ids) | set(excluded_ids)\
          \ == known_aux, name + '必须对每张辅助图明确使用或排除')\n        target_view = text(plan.get('target_view'),\
          \ f'{name}目标视角', 200)\n\n        item['identity_prompt'] = package['identity_prompt']\n\
          \        supplement = '、'.join(view_ids) if view_ids else '无'\n        excluded\
          \ = '、'.join(excluded_ids) if excluded_ids else '无'\n        routing = (\n\
          \            f'Identity anchor: PRIMARY. Target view: {target_view}. '\n\
          \            f'Use only these auxiliary view references: {\", \".join(view_ids)\
          \ if view_ids else \"none\"}. '\n            f'Do not upload or use these\
          \ excluded references: {\", \".join(excluded_ids) if excluded_ids else \"\
          none\"}.'\n        )\n        combined = package['identity_prompt'] + '\\\
          n\\n' + routing + '\\n\\n' + design\n        parts += [\n            f'##\
          \ {i}. {name}',\n            f'**画布规格**：{canvas}',\n            '### 手动生图参考图上传',\n\
          \            '- 始终上传：PRIMARY 主参考图',\n            f'- 本图补充上传：{supplement}',\n\
          \            f'- 本图不要上传：{excluded}',\n            '### 可复制完整提示词',\n    \
          \        combined,\n        ]\n    return {'answer': '\\n\\n'.join(parts),\
          \ 'package': dumps({'basis': package, 'images': images})}\n\n\ndef main(raw,\
          \ primary_files, auxiliary_files, product_category):\n    return prepare(raw,\
          \ primary_files, auxiliary_files, product_category)"
