    - data:
        code: "import json\n\n\ndef main(snapshot, handoff_status, generation_request_id,\
          \ task_id):\n    value = json.loads(snapshot) if isinstance(snapshot, str)\
          \ else snapshot\n    if not isinstance(value, dict):\n        value = {}\n\
          \    slots = value.get('slots', [])\n    lines = ['商品生图任务状态']\n    if handoff_status\
          \ != 'confirmed':\n        lines.append('状态或结果交接尚未确认，请勿重新提交；请按原生成请求编号联系任务服务核对。')\n\
          \    elif value.get('terminal') is not True:\n        lines.append('本次等待已结束，任务仍在处理中。后台可按原请求继续核对，无需再次提交。')\n\
          \    elif value.get('status') == 'completed':\n        lines.append('生图结果已交接到任务服务，请在已登录的任务结果页查看安全预览。')\n\
          \    elif value.get('status') == 'partial_failed':\n        lines.append('部分图位已完成，其余图位失败或取消；已完成结果交接到任务服务。')\n\
          \    else:\n        lines.append('任务已结束，具体安全状态已交接到任务服务。')\n    for slot\
          \ in slots if isinstance(slots, list) else []:\n        if not isinstance(slot,\
          \ dict):\n            continue\n        lines.append('图位 %s（%s）：%s' % (\n\
          \            slot.get('position', ''), slot.get('image_type', '商品图'), slot.get('status',\
          \ 'unknown')\n        ))\n    if generation_request_id:\n        lines.append('原生成请求编号：%s'\
          \ % generation_request_id)\n    if task_id:\n        lines.append('任务编号：%s'\
          \ % task_id)\n    return {'answer': '\\n\\n'.join(lines)}\n"
        code_language: python3
        desc: Returns status and task identity only; original artifacts remain behind
          the authenticated owner preview.
