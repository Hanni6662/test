    - data:
        code: |
          import hashlib
          import json
          import re
          import uuid
          from datetime import datetime, timezone

          def obj(value):
              value = json.loads(value) if isinstance(value, str) else value
              if not isinstance(value, dict):
                  raise ValueError('expected object')
              return value

          def canonical_sha256(value):
              payload = json.dumps(value, ensure_ascii=False, sort_keys=True,
                                   separators=(',', ':'), allow_nan=False).encode('utf-8')
              return hashlib.sha256(payload).hexdigest()

          def canonical_uuid(value):
              if not isinstance(value, str):
                  return False
              try:
                  return str(uuid.UUID(value)) == value
              except (TypeError, ValueError, AttributeError):
                  return False

          def main(body, status_code, task_id, submission_id, package_digest, image_types,
                   submission_body):
              empty = {'ready': 'no', 'accepted_body': '{}'}
              try:
                  if int(status_code) != 200:
                      return empty
                  result = obj(body)
                  submission = obj(submission_body)
                  types = json.loads(image_types) if isinstance(image_types, str) else image_types
                  expected_fields = {'status', 'contract_version', 'task_id', 'submission_id',
                                     'generation_request_id', 'package_digest', 'slots', 'permit'}
                  if (set(result) != expected_fields or result.get('status') not in {'accepted', 'replayed'}
                          or result.get('contract_version') != 'chatflow-handoff-v1'
                          or result.get('task_id') != task_id or result.get('submission_id') != submission_id
                          or result.get('package_digest') != package_digest):
                      return empty
                  if (submission.get('task_id') != task_id
                          or submission.get('submission_id') != submission_id
                          or submission.get('package_digest') != package_digest):
                      return empty
                  expected_request = str(uuid.uuid5(uuid.UUID(task_id),
                                                    'chatflow-generation-request:' + submission_id))
                  if result.get('generation_request_id') != expected_request:
                      return empty
                  permit = result.get('permit')
                  permit_fields = {'permit_id', 'permit_version', 'contract_version', 'slot_mapping_digest',
                                   'reference_manifest_digest', 'token', 'digest', 'expires_at'}
                  if (not isinstance(permit, dict) or set(permit) != permit_fields
                          or permit.get('permit_version') != 2
                          or permit.get('contract_version') != 'chatflow-generation-permit-v2'
                          or not isinstance(permit.get('token'), str) or not permit['token']
                          or not re.fullmatch(r'[0-9a-f]{64}', str(permit.get('slot_mapping_digest', '')))
                          or not re.fullmatch(r'[0-9a-f]{64}', str(permit.get('reference_manifest_digest', '')))
                          or not re.fullmatch(r'[0-9a-f]{64}', str(permit.get('digest', '')))
                          or hashlib.sha256(permit['token'].encode('ascii')).hexdigest() != permit['digest']):
                      return empty
                  try:
                      if str(uuid.UUID(permit.get('permit_id', ''))) != permit.get('permit_id'):
                          return empty
                  except (TypeError, ValueError, AttributeError):
                      return empty
                  expiry = datetime.fromisoformat(str(permit.get('expires_at', '')).replace('Z', '+00:00'))
                  if expiry.tzinfo is None or expiry.astimezone(timezone.utc) <= datetime.now(timezone.utc):
                      return empty
                  slots = result.get('slots')
                  if not isinstance(types, list) or not 1 <= len(types) <= 8 or not isinstance(slots, list) or len(slots) != len(types):
                      return empty
                  slot_mapping = []
                  task_items, attempts = set(), set()
                  for position, slot in enumerate(slots, 1):
                      if (not isinstance(slot, dict)
                              or set(slot) != {'task_item_id', 'attempt_id', 'slot_id', 'position', 'image_type'}
                              or slot.get('slot_id') != 'slot_%02d' % position
                              or not isinstance(slot.get('position'), int)
                              or isinstance(slot.get('position'), bool)
                              or slot.get('position') != position
                              or slot.get('image_type') != types[position - 1]):
                          return empty
                      item_id = slot.get('task_item_id')
                      attempt_id = slot.get('attempt_id')
                      if not canonical_uuid(item_id) or not canonical_uuid(attempt_id):
                          return empty
                      if item_id in task_items or attempt_id in attempts:
                          return empty
                      task_items.add(item_id)
                      attempts.add(attempt_id)
                      slot_mapping.append({
                          'slot_id': slot['slot_id'],
                          'position': position,
                          'image_type': slot['image_type'],
                          'task_item_id': item_id,
                          'attempt_id': attempt_id,
                      })
                  references = submission.get('references')
                  if not isinstance(references, list) or not 1 <= len(references) <= 4:
                      return empty
                  reference_manifest = []
                  for order, reference in enumerate(references, 1):
                      expected_ref_id = 'PRIMARY' if order == 1 else 'AUX%02d' % (order - 1)
                      if (not isinstance(reference, dict)
                              or set(reference) != {'ref_id', 'order', 'asset_id', 'content_sha256'}
                              or reference.get('ref_id') != expected_ref_id
                              or not isinstance(reference.get('order'), int)
                              or isinstance(reference.get('order'), bool)
                              or reference.get('order') != order
                              or not canonical_uuid(reference.get('asset_id'))
                              or not re.fullmatch(r'[0-9a-f]{64}', str(reference.get('content_sha256', '')))):
                          return empty
                      reference_manifest.append({
                          'asset_id': reference['asset_id'],
                          'position': order,
                          'content_sha256': reference['content_sha256'],
                          'ref_id': expected_ref_id,
                      })
                  if (canonical_sha256(slot_mapping) != permit['slot_mapping_digest']
                          or canonical_sha256(reference_manifest) != permit['reference_manifest_digest']):
                      return empty
                  return {'ready': 'yes', 'accepted_body': json.dumps(
                              result, ensure_ascii=False, separators=(',', ':'), allow_nan=False)}
              except (TypeError, ValueError, KeyError, AttributeError, json.JSONDecodeError, UnicodeEncodeError):
                  return empty
        code_language: python3
