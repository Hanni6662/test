        code: |
          import json


          def main(complete, state, audit):
              if complete != "yes":
                  return {"text": json.dumps({"conflicts": [], "auto_values": {}}, separators=(",", ":"))}
              selected = json.loads(state)
              selections = selected.get("selections", {})
              safe_d_values = {
                  "1": "无文字：合成测试图片",
                  "3": "清晰展示合成主体",
                  "4": "简洁商业视觉",
                  "5": "突出可见轮廓",
              }
              conflicts = []
              auto_values = {}
              for key, entry in selections.items():
                  mode = entry.get("mode")
                  if mode == "custom":
                      conflicts.append({
                          "kind": "identity",
                          "fields": [str(key)],
                          "reason": "V8_TEST_CUSTOM_TEXT_UNVERIFIED",
                      })
                  elif mode == "D":
                      if key not in safe_d_values:
                          conflicts.append({
                              "kind": "identity",
                              "fields": [str(key)],
                              "reason": "V8_TEST_FREE_DESIGN_UNSUPPORTED",
                          })
                      else:
                          auto_values[str(key)] = safe_d_values[key]
              return {"text": json.dumps(
                  {"conflicts": conflicts, "auto_values": auto_values}, separators=(",", ":")
              )}
