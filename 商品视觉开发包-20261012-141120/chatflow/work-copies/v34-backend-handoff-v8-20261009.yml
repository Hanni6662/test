    - data:
        code: |
          import hashlib
          import json
          import re
          import uuid
          from datetime import datetime, timezone

          PREF_KEYS = {'1': 'language', '3': 'usage_scene', '4': 'visual_style', '5': 'selling_points'}
          REF_IDS = ['PRIMARY', 'AUX01', 'AUX02', 'AUX03']

          def obj(value):
              value = json.loads(value) if isinstance(value, str) else value
              if not isinstance(value, dict):
                  raise ValueError('expected object')
              return value

          def valid_uuid(value):
              return isinstance(value, str) and str(uuid.UUID(value)) == value

          def main(context_body, context_status_code, package_raw, workflow_run_id):
              empty = {'ready': 'no', 'body': '{}', 'task_id': '', 'submission_id': '',
                       'package_digest': '', 'image_types': '[]'}
              try:
                  context = obj(context_body)
                  package = obj(package_raw)
                  if int(context_status_code) != 200:
                      return empty
                  if (context.get('contract_version') != 'visual-v34-stage-v1'
                          or context.get('flow_version') != 'visual-v3.4-single-selection'
                          or context.get('phase') != 'prompt'
                          or context.get('selection_status') != 'accepted'
                          or context.get('dify_run_id') != workflow_run_id):
                      return empty
                  for key in ('business_session_id', 'recommendation_id', 'task_id',
                              'selection_submission_id', 'prompt_submission_id'):
                      if not valid_uuid(context.get(key)):
                          return empty
                  expected_submission = str(uuid.uuid5(
                      uuid.UUID(context['selection_submission_id']), 'chatflow-prompt-package-v1'))
                  if context['prompt_submission_id'] != expected_submission:
                      return empty
                  expires = datetime.fromisoformat(str(context.get('expires_at', '')).replace('Z', '+00:00'))
                  if expires.tzinfo is None or expires.astimezone(timezone.utc) <= datetime.now(timezone.utc):
                      return empty
                  if set(package) != {'basis', 'images'} or not isinstance(package['basis'], dict):
                      return empty
                  basis = package['basis']
                  images = package['images']
                  image_types = context.get('image_types')
                  if (not isinstance(image_types, list) or not 1 <= len(image_types) <= 8
                          or context.get('selection', {}).get('image_types') != image_types
                          or basis.get('image_types') != image_types
                          or not isinstance(images, list)
                          or [item.get('type') if isinstance(item, dict) else None for item in images] != image_types):
                      return empty
                  refs = context.get('references')
                  if not isinstance(refs, list) or not 1 <= len(refs) <= 4:
                      return empty
                  expected_refs = REF_IDS[:len(refs)]
                  if ([item.get('ref_id') for item in refs] != expected_refs
                          or [item.get('order') for item in refs] != list(range(1, len(refs) + 1))
                          or any(not valid_uuid(item.get('asset_id'))
                                 or not re.fullmatch(r'[0-9a-f]{64}', str(item.get('content_sha256', '')))
                                 for item in refs)):
                      return empty
                  auxiliary = expected_refs[1:]
                  assets = basis.get('asset_ids')
                  if not isinstance(assets, dict) or assets.get('primary') != 'PRIMARY' or assets.get('auxiliary') != auxiliary:
                      return empty
                  recommendation = context.get('original_recommendation')
                  resolved = context.get('resolved_preferences')
                  form = basis.get('preference_form')
                  if not isinstance(recommendation, dict) or not isinstance(resolved, dict) or not isinstance(form, dict):
                      return empty
                  if set(form) != {'1', '2', '3', '4', '5'}:
                      return empty
                  for key, field_name in PREF_KEYS.items():
                      saved = resolved.get(field_name)
                      submitted = form.get(key)
                      if not isinstance(saved, dict) or not isinstance(submitted, dict):
                          return empty
                      mode = saved.get('mode')
                      if mode in {'A', 'B', 'C'}:
                          choices = recommendation.get('field_texts', {}).get(field_name)
                          index = ord(mode) - ord('A')
                          if (saved.get('source') != 'recommendation_original'
                                  or saved.get('recommendation_revision') != context.get('recommendation_revision')
                                  or not isinstance(choices, list) or len(choices) != 3
                                  or saved.get('text') != choices[index]
                                  or submitted.get('source') != mode
                                  or submitted.get('value') != choices[index]):
                              return empty
                      elif mode == 'custom':
                          if (not isinstance(saved.get('text'), str)
                                  or submitted.get('source') != 'custom'
                                  or submitted.get('value') != saved.get('text')):
                              return empty
                      elif mode == 'D':
                          if (saved.get('kind') != 'agent_design' or submitted.get('source') != 'D'
                                  or not isinstance(submitted.get('value'), str)
                                  or not submitted['value'].strip()):
                              return empty
                      else:
                          return empty
                  platform = resolved.get('platform')
                  if (not isinstance(platform, dict) or platform.get('mode') != 'platform'
                          or form['2'].get('source') != 'PLATFORM'
                          or form['2'].get('value') != platform.get('value')):
                      return empty
                  for image in images:
                      plan = image.get('reference_plan') if isinstance(image, dict) else None
                      if (not isinstance(plan, dict) or plan.get('identity_anchor_id') != 'PRIMARY'
                              or plan.get('view_reference_ids') != auxiliary
                              or plan.get('excluded_reference_ids') != []):
                          return empty
                  package_digest = hashlib.sha256(json.dumps(
                      package, ensure_ascii=False, sort_keys=True, separators=(',', ':'), allow_nan=False
                  ).encode('utf-8')).hexdigest()
                  submission = {
                      'contract_version': 'chatflow-handoff-v1',
                      'business_session_id': context['business_session_id'],
                      'recommendation_id': context['recommendation_id'],
                      'recommendation_revision': context['recommendation_revision'],
                      'dify_run_id': workflow_run_id,
                      'task_id': context['task_id'],
                      'submission_id': context['prompt_submission_id'],
                      'package_version': 'chatflow-prompt-package-v1',
                      'package_digest_version': 1,
                      'package_digest': package_digest,
                      'image_types': image_types,
                      'references': refs,
                      'prompt_package': package,
                  }
                  return {'ready': 'yes', 'body': json.dumps(
                              submission, ensure_ascii=False, separators=(',', ':'), allow_nan=False),
                          'task_id': context['task_id'], 'submission_id': context['prompt_submission_id'],
                          'package_digest': package_digest,
                          'image_types': json.dumps(image_types, ensure_ascii=False, separators=(',', ':'))}
              except (TypeError, ValueError, KeyError, AttributeError, json.JSONDecodeError):
                  return empty
        code_language: python3
