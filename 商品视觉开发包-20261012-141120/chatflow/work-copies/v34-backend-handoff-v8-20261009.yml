    - data:
        code: |
          import hashlib
          import json
          import uuid
          from datetime import datetime, timezone

          def obj(value):
              value = json.loads(value) if isinstance(value, str) else value
              if not isinstance(value, dict):
                  raise ValueError('expected object')
              return value

          def main(context_body, submission_body, accepted_body, workflow_run_id):
              empty = {'ready': 'no', 'body': '{}', 'business_session_id': '', 'generation_request_id': ''}
              try:
                  context, submission, accepted = obj(context_body), obj(submission_body), obj(accepted_body)
                  if (context.get('phase') != 'prompt' or context.get('selection_status') != 'accepted'
                          or context.get('dify_run_id') != workflow_run_id
                          or submission.get('dify_run_id') != workflow_run_id
                          or submission.get('task_id') != context.get('task_id')
                          or submission.get('business_session_id') != context.get('business_session_id')
                          or submission.get('recommendation_id') != context.get('recommendation_id')
                          or submission.get('submission_id') != context.get('prompt_submission_id')
                          or accepted.get('status') not in {'accepted', 'replayed'}
                          or accepted.get('task_id') != submission.get('task_id')
                          or accepted.get('submission_id') != submission.get('submission_id')
                          or accepted.get('package_digest') != submission.get('package_digest')):
                      return empty
                  package = submission.get('prompt_package')
                  package_digest = hashlib.sha256(json.dumps(
                      package, ensure_ascii=False, sort_keys=True, separators=(',', ':'), allow_nan=False
                  ).encode('utf-8')).hexdigest()
                  if package_digest != submission.get('package_digest'):
                      return empty
                  refs = submission.get('references')
                  if refs != context.get('references') or any(
                      not isinstance(ref, dict) or set(ref) != {'ref_id', 'order', 'asset_id', 'content_sha256'}
                      for ref in refs if isinstance(refs, list)
                  ):
                      return empty
                  permit = accepted.get('permit')
                  if not isinstance(permit, dict):
                      return empty
                  if (permit.get('permit_version') != 2
                          or permit.get('contract_version') != 'chatflow-generation-permit-v2'
                          or hashlib.sha256(permit.get('token', '').encode('ascii')).hexdigest() != permit.get('digest')):
                      return empty
                  expiry = datetime.fromisoformat(str(permit.get('expires_at', '')).replace('Z', '+00:00'))
                  if expiry.tzinfo is None or expiry.astimezone(timezone.utc) <= datetime.now(timezone.utc):
                      return empty
                  request_id = str(uuid.UUID(str(accepted.get('generation_request_id'))))
                  if request_id != accepted.get('generation_request_id'):
                      return empty
                  request = {
                      'contract_version': 'chatflow-image-generation-v3',
                      'generation_request_id': request_id,
                      'task_id': accepted.get('task_id'),
                      'dify_run_id': workflow_run_id,
                      'permit_version': permit.get('permit_version'),
                      'permit_contract_version': permit.get('contract_version'),
                      'permit': permit.get('token'),
                      'package_digest': accepted.get('package_digest'),
                      'slot_mapping_digest': permit.get('slot_mapping_digest'),
                      'reference_manifest_digest': permit.get('reference_manifest_digest'),
                      'prompt_package': package,
                      'references': refs,
                      'slots': accepted.get('slots'),
                  }
                  if any('url' in ref for ref in refs):
                      return empty
                  return {'ready': 'yes', 'body': json.dumps(
                              request, ensure_ascii=False, separators=(',', ':'), allow_nan=False),
                          'business_session_id': str(submission.get('business_session_id')),
                          'generation_request_id': request_id}
              except (TypeError, ValueError, KeyError, AttributeError, json.JSONDecodeError, UnicodeEncodeError):
                  return empty
