    - data:
        code: |
          import hashlib
          import json
          import re
          import uuid


          def load(value):
              return json.loads(value) if isinstance(value, str) else value


          def main(context_body, context_status_code, start_context_raw, workflow_run_id, parse_state_raw, complete):
              empty = {
                  'ready': 'no', 'body': '{}', 'business_session_id': '',
                  'recommendation_id': '', 'recommendation_revision': '', 'task_id': '',
                  'submission_id': '', 'run_id': '', 'event_key': '',
              }
              try:
                  context = load(context_body)
                  start_context = load(start_context_raw)
                  state = load(parse_state_raw)
                  status_code = int(context_status_code)
                  if status_code != 200 or not isinstance(context, dict) or not isinstance(start_context, dict):
                      return empty
                  if context.get('contract_version') != 'visual-v34-stage-v1':
                      return empty
                  if context.get('flow_version') != 'visual-v3.4-single-selection' or context.get('phase') != 'selection':
                      return empty
                  if context.get('selection_status') not in {'pending', 'unknown', 'accepted'} or complete != 'yes':
                      return empty
                  session_id = str(uuid.UUID(context.get('business_session_id', '')))
                  recommendation_id = str(uuid.UUID(context.get('recommendation_id', '')))
                  task_id = str(uuid.UUID(context.get('task_id', '')))
                  submission_id = str(uuid.UUID(context.get('selection_submission_id', '')))
                  if str(uuid.UUID(start_context.get('business_session_id', ''))) != session_id:
                      return empty
                  if not isinstance(workflow_run_id, str) or not re.fullmatch(r'[A-Za-z0-9_.:-]{1,320}', workflow_run_id):
                      return empty
                  if context.get('dify_run_id') != workflow_run_id:
                      return empty
                  revision = context.get('recommendation_revision')
                  if isinstance(revision, bool) or not isinstance(revision, int) or revision < 1:
                      return empty
                  if not isinstance(state, dict) or not isinstance(state.get('selections'), dict):
                      return empty
                  selections = state['selections']
                  if set(selections) != {'1', '2', '3', '4', '5'} or state.get('issues'):
                      return empty
                  image_types = state.get('image_types')
                  if not isinstance(image_types, list) or not 1 <= len(image_types) <= 8:
                      return empty
                  if any(not isinstance(item, str) or not item for item in image_types) or len(set(image_types)) != len(image_types):
                      return empty

                  preferences = {}
                  for field_id, name in (('1', 'language'), ('3', 'usage_scene'), ('4', 'visual_style'), ('5', 'selling_points')):
                      entry = selections[field_id]
                      if not isinstance(entry, dict):
                          return empty
                      mode, value = entry.get('mode'), entry.get('value')
                      if mode in {'A', 'B', 'C', 'D'}:
                          preferences[name] = {'mode': mode}
                      elif mode == 'custom' and isinstance(value, str) and value.strip():
                          preferences[name] = {'mode': 'custom', 'text': value}
                      else:
                          return empty
                  platform_entry = selections['2']
                  if not isinstance(platform_entry, dict) or platform_entry.get('mode') != 'PLATFORM':
                      return empty
                  platform = platform_entry.get('value')
                  if not isinstance(platform, str) or not platform:
                      return empty
                  preferences['platform'] = platform

                  event = {
                      'contract_version': 'visual-v34-stage-v1',
                      'flow_version': 'visual-v3.4-single-selection',
                      'business_session_id': session_id,
                      'recommendation_id': recommendation_id,
                      'recommendation_revision': revision,
                      'dify_run_id': workflow_run_id,
                      'node_id': 'parse_0',
                      'event_key': 'selection:' + submission_id,
                      'digest_version': 1,
                      'event_type': 'selection.applied',
                      'payload': {
                          'selection_submission_id': submission_id,
                          'parse_state': {'preferences': preferences, 'image_types': image_types},
                      },
                  }
                  canonical = json.dumps(event, sort_keys=True, separators=(',', ':'), ensure_ascii=False, allow_nan=False)
                  event['digest'] = hashlib.sha256(canonical.encode('utf-8')).hexdigest()
                  return {
                      'ready': 'yes',
                      'body': json.dumps(event, separators=(',', ':'), ensure_ascii=False, allow_nan=False),
                      'business_session_id': session_id,
                      'recommendation_id': recommendation_id,
                      'recommendation_revision': str(revision),
                      'task_id': task_id,
                      'submission_id': submission_id,
                      'run_id': workflow_run_id,
                      'event_key': event['event_key'],
                  }
              except (TypeError, ValueError, KeyError, json.JSONDecodeError):
                  return empty
        code_language: python3
        desc: ''
        outputs:
          body:
            children:
            type: string
          business_session_id:
            children:
            type: string
          event_key:
            children:
            type: string
          ready:
            children:
