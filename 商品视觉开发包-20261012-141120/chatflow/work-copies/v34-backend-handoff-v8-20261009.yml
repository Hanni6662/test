    - data:
        code: |
          import hashlib
          import json
          import re
          from datetime import datetime

          IMAGE_CONTRACT = 'chatflow-image-generation-v3'
          PERMIT_CONTRACT = 'chatflow-generation-permit-v2'
          EVENT_CONTRACT = 'chatflow-generation-event-v1'
          MANIFEST_CONTRACT = 'chatflow-generation-result-manifest-v1'
          EVENT_NAMESPACE = 'b0a927f6-4574-542d-b401-95c6c8bf6b12'
          UUID_RE = re.compile(r'^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$')
          SHA_RE = re.compile(r'^[0-9a-f]{64}$')
          SLOT_RE = re.compile(r'^slot_0[1-8]$')
          FILE_RE = re.compile(r'^slot_0[1-8]-original-1\.(png|jpg|jpeg|webp)$')
          MIME_BY_EXT = {'png': 'image/png', 'jpg': 'image/jpeg', 'jpeg': 'image/jpeg', 'webp': 'image/webp'}
          SLOT_STATUSES = {'queued', 'submitting', 'submission_unknown', 'pending', 'processing', 'persisting', 'completed', 'failed', 'cancelled', 'protocol_error'}
          TERMINAL = {'completed', 'failed', 'cancelled', 'protocol_error'}


          def _obj(raw):
              value = json.loads(raw) if isinstance(raw, str) else raw
              if not isinstance(value, dict):
                  raise ValueError('expected object')
              return value


          def _uuid(value):
              if not isinstance(value, str) or not UUID_RE.fullmatch(value):
                  raise ValueError('invalid UUID')
              return value


          def _int(value, minimum=1):
              if isinstance(value, bool) or not isinstance(value, int) or value < minimum:
                  raise ValueError('invalid integer')
              return value


          def _digest(value):
              if not isinstance(value, str) or not SHA_RE.fullmatch(value):
                  raise ValueError('invalid digest')
              return value


          def _event_id(request_id, source_sequence):
              raw = bytearray(hashlib.sha256(
                  ('v7-generation-event:' + EVENT_NAMESPACE + ':' + request_id + ':' + str(source_sequence)).encode('ascii')
              ).digest()[:16])
              raw[6] = (raw[6] & 0x0f) | 0x50
              raw[8] = (raw[8] & 0x3f) | 0x80
              value = bytes(raw).hex()
              return value[:8] + '-' + value[8:12] + '-' + value[12:16] + '-' + value[16:20] + '-' + value[20:]


          def _artifact(raw, slot_id):
              if not isinstance(raw, dict):
                  raise ValueError('invalid artifact reference')
              file_id = raw.get('file_id')
              if not isinstance(file_id, str) or not FILE_RE.fullmatch(file_id) or not file_id.startswith(slot_id + '-'):
                  raise ValueError('invalid original artifact identity')
              extension = file_id.rsplit('.', 1)[1]
              mime_type = raw.get('mime_type')
              if mime_type != MIME_BY_EXT[extension]:
                  raise ValueError('artifact MIME mismatch')
              sha256 = _digest(raw.get('sha256'))
              size_bytes = _int(raw.get('size_bytes'))
              if size_bytes > 33554432:
                  raise ValueError('original artifact is oversized')
              expires_at = raw.get('expires_at')
              if expires_at is not None:
                  if not isinstance(expires_at, str):
                      raise ValueError('invalid expiry')
                  parsed = datetime.fromisoformat(expires_at.replace('Z', '+00:00'))
                  if parsed.tzinfo is None:
                      raise ValueError('expiry timezone missing')
                  expires_at = parsed.isoformat()
              return {
                  'file_id': file_id,
                  'sha256': sha256,
                  'mime_type': mime_type,
                  'size_bytes': size_bytes,
                  'expires_at': expires_at,
              }


          def _bundle(request, snapshot):
              request_id = _uuid(request.get('generation_request_id'))
              task_id = _uuid(request.get('task_id'))
              run_id = request.get('dify_run_id')
              if not isinstance(run_id, str) or not 1 <= len(run_id) <= 320:
                  raise ValueError('invalid Dify run identity')
              if request.get('contract_version') != IMAGE_CONTRACT:
                  raise ValueError('request contract mismatch')
              if request.get('permit_version') != 2 or request.get('permit_contract_version') != PERMIT_CONTRACT:
                  raise ValueError('permit contract mismatch')
              package_digest = _digest(request.get('package_digest'))
              slot_mapping_digest = _digest(request.get('slot_mapping_digest'))
              reference_manifest_digest = _digest(request.get('reference_manifest_digest'))
              refs = request.get('references')
              if not isinstance(refs, list) or not 1 <= len(refs) <= 4:
                  raise ValueError('invalid URL-free reference manifest')
              for position, ref in enumerate(refs, 1):
                  if not isinstance(ref, dict) or set(ref) != {'asset_id', 'ref_id', 'order', 'content_sha256'}:
                      raise ValueError('invalid URL-free reference')
                  _uuid(ref.get('asset_id'))
                  _digest(ref.get('content_sha256'))
                  ref_order = ref.get('order')
                  if (isinstance(ref_order, bool) or not isinstance(ref_order, int) or ref_order != position
                          or not isinstance(ref.get('ref_id'), str) or 'url' in ref):
                      raise ValueError('reference order or URL invalid')

              identity = {
                  'contract_version': IMAGE_CONTRACT,
                  'generation_request_id': request_id,
                  'task_id': task_id,
                  'dify_run_id': run_id,
                  'permit_version': 2,
                  'package_digest': package_digest,
                  'slot_mapping_digest': slot_mapping_digest,
                  'reference_manifest_digest': reference_manifest_digest,
              }
              for key, expected in identity.items():
                  if snapshot.get(key) != expected:
                      raise ValueError('v3 snapshot identity mismatch')
              if snapshot.get('permit_version') != 2:
                  raise ValueError('v3 snapshot permit version mismatch')
              batch_id = snapshot.get('batch_id')
              if not isinstance(batch_id, str) or not re.fullmatch(r'[A-Za-z0-9._:-]{1,128}', batch_id):
                  raise ValueError('invalid batch identity')
              source_sequence = _int(snapshot.get('source_sequence'))
              request_slots = request.get('slots')
              snapshot_slots = snapshot.get('slots')
              if not isinstance(request_slots, list) or not 1 <= len(request_slots) <= 8:
                  raise ValueError('invalid request slot mapping')
              if not isinstance(snapshot_slots, list) or len(snapshot_slots) != len(request_slots):
                  raise ValueError('v3 snapshot slot count mismatch')

              event_slots = []
              manifest_slots = []
              safe_slots = []
              for position, (expected, raw) in enumerate(zip(request_slots, snapshot_slots), 1):
                  if not isinstance(expected, dict) or not isinstance(raw, dict):
                      raise ValueError('invalid slot object')
                  slot_id = expected.get('slot_id')
                  task_item_id = _uuid(expected.get('task_item_id'))
                  attempt_id = _uuid(expected.get('attempt_id'))
                  image_type = expected.get('image_type')
                  if (not isinstance(slot_id, str) or not SLOT_RE.fullmatch(slot_id)
                          or isinstance(expected.get('position'), bool)
                          or not isinstance(expected.get('position'), int)
                          or expected.get('position') != position
                          or not isinstance(image_type, str) or not 1 <= len(image_type) <= 80):
                      raise ValueError('invalid request slot mapping')
                  if (isinstance(raw.get('position'), bool) or not isinstance(raw.get('position'), int)
                          or raw.get('position') != position):
                      raise ValueError('v3 snapshot slot position is not a strict integer')
                  for key, value in (('slot_id', slot_id), ('task_item_id', task_item_id),
                                     ('attempt_id', attempt_id), ('position', position), ('image_type', image_type)):
                      if raw.get(key) != value:
                          raise ValueError('v3 snapshot slot mapping mismatch')
                  status = raw.get('status')
                  if status not in SLOT_STATUSES:
                      raise ValueError('invalid slot status')
                  status_version = _int(raw.get('status_version'))
                  error_code = raw.get('error_code')
                  if error_code is not None and (not isinstance(error_code, str) or not re.fullmatch(r'[a-z][a-z0-9_]{0,79}', error_code)):
                      raise ValueError('invalid safe error code')
                  retry_count = raw.get('known_retry_count')
                  if status in {'submitting', 'submission_unknown'}:
                      if retry_count is not None:
                          raise ValueError('ambiguous retry count must be hidden')
                  elif retry_count is not None:
                      retry_count = _int(retry_count, 0)

                  raw_artifacts = raw.get('artifact_ref')
                  if not isinstance(raw_artifacts, list):
                      raise ValueError('invalid artifact references')
                  originals = [item for item in raw_artifacts if isinstance(item, dict) and item.get('kind') == 'original']
                  source_artifact = None
                  if status == 'completed':
                      if len(originals) != 1:
                          raise ValueError('completed slot must have one original artifact')
                      source_artifact = _artifact(originals[0], slot_id)
                  elif originals:
                      raise ValueError('non-completed slot cannot hand off an original artifact')
                  event_slot = {
                      'slot_id': slot_id,
                      'task_item_id': task_item_id,
                      'attempt_id': attempt_id,
                      'position': position,
                      'image_type': image_type,
                      'status': status,
                      'status_version': status_version,
                      'error_code': error_code,
                      'known_retry_count': retry_count,
                  }
                  event_slots.append(event_slot)
                  manifest_slots.append({
                      'slot_id': slot_id,
                      'task_item_id': task_item_id,
                      'attempt_id': attempt_id,
                      'position': position,
                      'image_type': image_type,
                      'status_version': status_version,
                      'original_artifact': source_artifact,
                  })
                  safe_refs = [] if source_artifact is None else [{'kind': 'original', **source_artifact}]
                  safe_slots.append({**event_slot, 'artifact_ref': safe_refs})

              computed_terminal = all(slot['status'] in TERMINAL for slot in event_slots)
              if not computed_terminal:
                  computed_status = 'running'
              elif all(slot['status'] == 'completed' for slot in event_slots):
                  computed_status = 'completed'
              elif any(slot['status'] == 'completed' for slot in event_slots):
                  computed_status = 'partial_failed'
              else:
                  computed_status = 'failed'
              if snapshot.get('terminal') is not computed_terminal or snapshot.get('status') != computed_status:
                  raise ValueError('v3 aggregate status mismatch')

              event = {
                  'contract_version': 'chatflow-generation-event-v1',
                  'business_session_id': _uuid(request.get('business_session_id')),
                  'task_id': task_id,
                  'generation_request_id': request_id,
                  'dify_run_id': run_id,
                  'batch_id': batch_id,
                  'permit_version': 2,
                  'permit_contract_version': PERMIT_CONTRACT,
                  'package_digest': package_digest,
                  'slot_mapping_digest': slot_mapping_digest,
                  'reference_manifest_digest': reference_manifest_digest,
                  'event_id': _event_id(request_id, source_sequence),
                  'source': 'image_generation',
                  'source_sequence': source_sequence,
                  'status': computed_status,
                  'digest_version': 1,
                  'workflow_retry_count': None,
                  'slots': event_slots,
              }
              canonical = json.dumps(event, sort_keys=True, separators=(',', ':'), ensure_ascii=False, allow_nan=False)
              event['digest'] = hashlib.sha256(canonical.encode('utf-8')).hexdigest()
              manifest = {
                  'contract_version': MANIFEST_CONTRACT,
                  'status_event': event,
                  'slots': manifest_slots,
              }
              safe_snapshot = {
                  **identity,
                  'batch_id': batch_id,
                  'source_sequence': source_sequence,
                  'status': computed_status,
                  'terminal': computed_terminal,
                  'slots': safe_slots,
              }
              return {
                  'generation_request_id': request_id,
                  'task_id': task_id,
                  'batch_id': batch_id,
                  'source_sequence': source_sequence,
                  'snapshot': json.dumps(safe_snapshot, ensure_ascii=False, separators=(',', ':'), allow_nan=False),
                  'event_body': json.dumps(event, ensure_ascii=False, separators=(',', ':'), allow_nan=False),
                  'manifest_body': json.dumps(manifest, ensure_ascii=False, separators=(',', ':'), allow_nan=False),
                  'done': 'yes' if computed_terminal else 'no',
              }

          def main(body, status_code, request_body, business_session_id):
              request_id = ''
              try:
                  request = _obj(request_body)
                  request_id = _uuid(request.get('generation_request_id'))
                  request['business_session_id'] = _uuid(business_session_id)
                  if isinstance(status_code, bool) or int(status_code) != 200:
                      raise ValueError('original request lookup not confirmed')
                  snapshot = _obj(body)
                  bundle = _bundle(request, snapshot)
                  return {'ok': 'yes', 'message': '', **bundle}
              except (TypeError, ValueError, KeyError, OverflowError):
                  suffix = request_id if request_id else '不可用'
                  return {
                      'ok': 'no', 'message': '生图受理结果尚未核实。请勿重新提交；请按原 generation_request_id 核对：' + suffix,
                      'generation_request_id': request_id, 'task_id': '', 'batch_id': '', 'source_sequence': 0,
                      'snapshot': '{}', 'event_body': '{}', 'manifest_body': '{}', 'done': 'no',
                  }
        code_language: python3
        desc: 'Validates the full v3 acceptance snapshot against the original H4 request and prepares URL-free H6/H7
          callbacks.'
