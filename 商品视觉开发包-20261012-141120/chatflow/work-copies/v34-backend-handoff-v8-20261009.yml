app:
  description: 保留主辅参考图与五项偏好，逐图位调用 APIMart GPT-Image-2.5 Ext，自动返回成图。
  icon: 🧭
  icon_background: '#E0F2FE'
  icon_type: emoji
  mode: advanced-chat
  name: 商品视觉 v3.4｜多参考图自动生图（本机修复草稿）
  use_icon_as_answer_icon: false
dependencies:
- current_identifier:
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/openai_api_compatible:0.0.68@ba61c5eccb814be7364117c0bec3710a51e09b20f31e37243e747a00f9377969
    version:
kind: app
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables:
  - description: APIMart 生图服务配置
    id: generation-image_service_url
    name: IMAGE_SERVICE_URL
    selector:
    - env
    - IMAGE_SERVICE_URL
    value: http://v8-endpoint.invalid
    value_type: string
  - description: APIMart 生图服务配置
    id: generation-image_service_token
    name: IMAGE_SERVICE_TOKEN
    selector:
    - env
    - IMAGE_SERVICE_TOKEN
    value: ''
    value_type: secret
  - description: APIMart 生图服务配置
    id: generation-dify_files_base_url
    name: DIFY_FILES_BASE_URL
    selector:
    - env
    - DIFY_FILES_BASE_URL
    value: http://v8-endpoint.invalid
    value_type: string
  - description: Isolated test-only generation gate; closed by default.
    id: v34-test-generation-enabled
    name: V34_TEST_GENERATION_ENABLED
    selector:
    - env
    - V34_TEST_GENERATION_ENABLED
    value: "true"
    value_type: string
  - description: Isolated backend callback URL; invalid by default until the test stack is configured.
    id: v34-backend-stage-event-url
    name: BACKEND_STAGE_EVENT_URL
    selector:
    - env
    - BACKEND_STAGE_EVENT_URL
    value: http://v8-endpoint.invalid/internal/v1/dify/stage-events
    value_type: string
  - description: Isolated backend callback credential; intentionally empty by default.
    id: v34-backend-stage-event-token
    name: BACKEND_STAGE_EVENT_TOKEN
    selector:
    - env
    - BACKEND_STAGE_EVENT_TOKEN
    value: ''
    value_type: secret
  - description: Isolated backend context URL base; invalid by default.
    id: v34-backend-context-base-url
    name: BACKEND_CONTEXT_BASE_URL
    selector:
    - env
    - BACKEND_CONTEXT_BASE_URL
    value: http://v8-endpoint.invalid/internal/v1/dify/business-sessions
    value_type: string
  - description: Isolated H4 prompt-package endpoint; invalid by default.
    id: v34-backend-prompt-package-url
    name: BACKEND_PROMPT_PACKAGE_URL
    selector:
    - env
    - BACKEND_PROMPT_PACKAGE_URL
    value: http://v8-endpoint.invalid/internal/v1/dify/prompt-packages
    value_type: string
  - description: Isolated H6 event callback URL; invalid by default.
    id: v7-backend-generation-event-url
    name: BACKEND_GENERATION_EVENT_URL
    selector:
    - env
    - BACKEND_GENERATION_EVENT_URL
    value: http://v8-endpoint.invalid/internal/v1/dify/generation-events
    value_type: string
  - description: Isolated H7 result manifest callback URL; invalid by default.
    id: v7-backend-generation-result-url
    name: BACKEND_GENERATION_RESULT_URL
    selector:
    - env
    - BACKEND_GENERATION_RESULT_URL
    value: http://v8-endpoint.invalid/internal/v1/dify/generation-results
    value_type: string
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .WEBP
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      image:
        enabled: false
        number_limits: 20
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 20
    opening_statement: 请先上传 1 张主参考图（必填）：它是产品一致性的核心证据，建议选择包含最主要或最多产品信息的图片。可再上传 0–3 张辅助参考图，用于产品信息补充或细节补充。填写产品品类后，一次选择语言、固定平台、使用场景、视觉风格和商品卖点，再勾选需要的图片类型；Agent
      会在保持商品物理特征的前提下自主完成构图与八图分工。
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 开始设计商品图
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
