        code: |
          import hashlib
          import json
          import uuid


          def main(backend_context, workflow_run_id, audit):
              context = json.loads(backend_context) if isinstance(backend_context, str) else backend_context
              if not isinstance(context, dict):
                  raise ValueError('backend context is invalid')
              if context.get('contract_version') != 'visual-v34-stage-v1':
                  raise ValueError('backend contract version is invalid')
              if context.get('flow_version') != 'visual-v3.4-single-selection':
                  raise ValueError('backend flow version is invalid')
              session_id = str(uuid.UUID(context.get('business_session_id', '')))
              recommendation_id = str(uuid.UUID(context.get('recommendation_id', '')))
              uuid.UUID(context.get('start_operation_id', ''))
              revision = context.get('recommendation_revision')
              if isinstance(revision, bool) or not isinstance(revision, int) or revision < 1:
                  raise ValueError('recommendation revision is invalid')
              if not isinstance(workflow_run_id, str) or not workflow_run_id.strip():
                  raise ValueError('workflow run id is invalid')
              if not isinstance(audit, str) or len(audit.encode('utf-8')) > 65536:
