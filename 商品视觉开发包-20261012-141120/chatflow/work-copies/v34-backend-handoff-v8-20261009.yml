    - data:
        code: |-
          """Compact product-visual flow. Pure functions embedded into Dify Code nodes."""
          import json
          import re

          FIELDS = ['语言种类', '使用的电商平台', '使用场景', '视觉风格', '商品卖点']
          GENERATED_FIELD_IDS = ['1', '3', '4', '5']
          PLATFORMS = ['亚马逊主图', '亚马逊高级A+', 'TEMU', 'TEMU服饰类', 'TIKTOK', '淘宝', '京东', '拼多多', '1688']
          TYPES = [
              '品牌导购主视觉', '核心卖点信息图', '生活方式海报', '多场景展示图',
              '场景化卖点图', '使用体验图', 'SKU展示图', '细节展示图',
          ]

          PLATFORM_RULES = {
              '亚马逊主图': '整套采用 1:1。品牌导购主视觉若作为商品首图，使用纯白背景，不添加文字、边框、水印或装饰；其他图片可按职责展示场景、细节与信息层级。',
              '亚马逊高级A+': '品牌导购主视觉采用 1464 x 1800 px 纵向沉浸式构图；其余图片采用 1464 x 600 px 横向模块化构图。',
              'TEMU': '整套采用 1:1，商品清晰完整且主体突出；按图片职责使用场景、细节与简洁信息表达。',
              'TEMU服饰类': '整套采用 3:4 竖向构图，完整表现服饰轮廓，并为人物动作、穿着状态和场景留出空间。',
              'TIKTOK': '整套采用 1:1，商品清晰完整；辅助图片强调真实使用、动作感、多角度和快速理解。',
              '淘宝': '整套采用 800 x 800 px 方形画布，商品主体清晰、完整、易辨识；避免与商品无关的元素干扰主体。',
              '京东': '整套采用 800 x 800 px 方形画布，商品主体清晰、完整、占据视觉中心；根据图片职责控制场景与信息层级。',
              '拼多多': '整套采用 800 x 800 px 方形画布，商品主体清晰且容易快速识别；装饰与文字不得遮挡商品关键结构。',
              '1688': '整套采用 800 x 800 px 方形画布，以清晰呈现商品外观、结构与可见细节为主；背景与信息表达应服务于供货商品的快速判断。',
           }

          _AGE_PATTERN = re.compile(r'童装|儿童|女童|男童|婴幼儿|children|\bchild\b|\bkids?\b', re.I)
          _PERFORMANCE_PATTERN = re.compile(
              r'\bUPF\s*\d+\+?\b|'
              r'(?:具备|具有|拥有|提供|保证|达到|实现|支持|通过|经过)[^，。；;]{0,24}'
              r'(?:防晒|防紫外线|速干|抗菌|防水|防风|防皱|透气|保暖|吸湿|排汗|阻燃)|'
              r'(?:防晒|防紫外线|速干|抗菌|防水|防风|防皱|透气|保暖|吸湿|排汗|阻燃)'
              r'(?:等级|指数|性能|功能|功效|效果|认证)|'
              r'\b(?:guaranteed|certified|rated|provides?|offers?|delivers?)\b[^,.;]{0,28}'
              r'(?:UV\s*protection|waterproof|quick[\s-]?dry|antibacterial|windproof|breathable|moisture[\s-]?wicking)',
              re.I,
          )
          _MATERIAL_PATTERN = re.compile(
              r'纯棉|全棉|棉质|羊毛|羊绒|涤纶|聚酯|锦纶|尼龙|氨纶|真丝|丝绸|亚麻|'
              r'真皮|皮革|PU\s*皮|金属材质|塑料材质|木质材料|陶瓷材质|玻璃材质|'
              r'\bcotton\b|\bwool\b|\bcashmere\b|\bpolyester\b|\bnylon\b|'
              r'\bspandex\b|\bsilk\b|\blinen\b|\bleather\b|made\s+of\s+(?:metal|plastic|wood|ceramic|glass)',
              re.I,
          )
          _LANGUAGE_PATTERN = re.compile(
              r'简体中文|繁体中文|中文|英语|英文|中英文|中英双语|英中双语|德语|法语|西班牙语|日语|韩语|阿拉伯语|'
              r'无文字|无文案|不放文字|不添加可见文字|不含文字|纯视觉|'
              r'\bChinese\b|\bEnglish\b|\bGerman\b|\bFrench\b|\bSpanish\b|'
              r'\bJapanese\b|\bKorean\b|\bArabic\b|\bno\s+(?:text|copy)\b|\btext[\s-]?free\b',
              re.I,
           )
          _NO_TEXT_PATTERN = re.compile(
              r'(?:不(?:添加|使用|展示|出现|包含|含有|放置|放入|需要)|无需|禁止添加|避免添加)'
              r'[^，。；;]{0,28}(?:可见)?(?:文字|文案|文本|字符|字样|标签)',
              re.I,
          )


          def dumps(value):
              return json.dumps(value, ensure_ascii=False)


          def read(raw):
              raw = re.sub(r'^\x60\x60\x60(?:json)?\s*|\s*\x60\x60\x60$', '', str(raw or '').strip())
              require(bool(raw), '模型输出为空')
              try:
                  value, end = json.JSONDecoder().raw_decode(raw)
              except json.JSONDecodeError as exc:
                  raise ValueError(f'模型输出不是有效 JSON：{exc.msg}') from exc
              tail = raw[end:].strip()
              if tail.startswith('{'):
                  try:
                      second, second_end = json.JSONDecoder().raw_decode(tail)
                  except json.JSONDecodeError as exc:
                      raise ValueError(f'JSON 尾部存在不完整对象：{exc.msg}') from exc
                  remainder = tail[second_end:].strip()
                  require(not remainder.startswith('{'), '模型返回了超过两个 JSON 对象')
                  can_merge = (
                      isinstance(value, dict) and isinstance(second, dict)
                      and isinstance(value.get('images'), list) and isinstance(second.get('images'), list)
                  )
                  require(can_merge, '模型返回了两个无法合并的 JSON 对象')
                  value['images'] = value['images'] + second['images']
              if not isinstance(value, dict):
                  raise ValueError('模型输出必须是 JSON 对象')
              return value


          def require(condition, message):
              if not condition:
                  raise ValueError(message)


          def text(value, label, limit=3500):
              require(isinstance(value, str) and 0 < len(value.strip()) <= limit, label + '缺失或过长')
              return value.strip()


          def validate_field_value(field_id, value):
              key = str(field_id)
              value = text(value, f'第{key}项内容')
              if key == '1':
                  require(_LANGUAGE_PATTERN.search(value) or _NO_TEXT_PATTERN.search(value),
                          '第1项必须明确一种图片文字语言或无文字')
              if key == '2':
                  require(value in PLATFORMS, '第2项必须选择一个固定平台')
              return value


          def canvas_for(platform, image_type):
              require(platform in PLATFORMS, '平台选择无效')
              require(image_type in TYPES, '图片类型无效')
              if platform == '亚马逊高级A+':
                  return '1464 x 1800 px' if image_type == TYPES[0] else '1464 x 600 px'
              if platform == 'TEMU服饰类':
                  return '3:4'
              if platform in {'淘宝', '京东', '拼多多', '1688'}:
                  return '800 x 800 px'
              return '1:1'


          def build_platform_profile(platform, image_types):
              require(platform in PLATFORMS, '平台选择无效')
              require(isinstance(image_types, list) and image_types, '图片类型选择无效')
              return {
                  'platform': platform,
                  'rule': PLATFORM_RULES[platform],
                  'canvases': [{'type': name, 'canvas': canvas_for(platform, name)} for name in image_types],
              }


          def option_values(field):
              if str(field.get('id')) == '2':
                  return [f'PLATFORM|||{name}' for name in PLATFORMS]
              options = field['options']
              return [f'{letter}|||{value}' for letter, value in zip('ABC', options)] + [
                  'D|||由视觉审核 Agent 自由设计',
                  'custom|||自定义',
              ]


          def _saved_option(entry):
              value = entry.get('value') or '由视觉审核 Agent 自由设计'
              return 'LOCKED|||已保存：' + value


          def _choice_options(audit, state):
              selections, issues = state.get('selections', {}), state.get('issues', {})
              result = {}
              for i, field in enumerate(audit['fields'], 1):
                  key = str(i)
                  result[f'choice_{i}_options'] = (
                      [_saved_option(selections[key])]
                      if key in selections and key not in issues
                      else option_values(field)
                  )
              return result


          def render_form(audit, state):
              selections = state.get('selections', {})
              issues = state.get('issues', {})
              pending = [str(i) for i in range(1, 6) if str(i) not in selections or str(i) in issues]
              lines = [
                  '## 为商品图注入你的设计偏好',
                  audit['summary'],
                  '**用户声明的产品品类**：' + audit['declared_category'],
                  '**产品保真边界**：' + '；'.join(audit['identity_constraints']),
                  '**尚不能从图片确认**：' + ('；'.join(audit['unknowns']) or '无额外记录'),
                  '五项是给设计 Agent 的方向参考，不是限制画面质量的硬合同。请选择语言、固定平台、使用场景、视觉风格和商品卖点；选择 D 即授权 Agent 完成该项。',
              ]
              if selections:
                  lines.append('### 已保存的偏好')
                  for key in map(str, range(1, 6)):
                      if key in selections:
                          entry = selections[key]
                          lines.append(f"{key}. {FIELDS[int(key)-1]}：{entry['value'] or 'D · 交给 Agent 设计'}")
              if pending:
                  lines.append('**本次需要填写或修正：' + '、'.join(pending) + '。其他项已锁定保留。**')
              if state.get('message'):
                  lines.append(state['message'])
              for key in pending:
                  if key in issues:
                      lines.append(f'第{key}项需修正：{issues[key]}')
              lines.append('提交后由 Agent 自主完成构图与八图分工；只有会改变商品本体的要求才会请求修正。')
              return '\n\n'.join(lines)


          def prepare(raw, primary_files, auxiliary_files, product_category):
              auxiliary_files = [] if auxiliary_files is None else auxiliary_files
              require(isinstance(primary_files, list) and len(primary_files) == 1, '请上传且仅上传 1 张主参考图')
              require(isinstance(auxiliary_files, list) and len(auxiliary_files) <= 3, '辅助参考图最多 3 张')
              category = text(product_category, '产品品类', 100)
              audit = read(raw)
              audit['declared_category'] = category
              audit['summary'] = text(audit.get('summary'), '商品概述', 1000)
              audit['primary_view'] = text(audit.get('primary_view'), '主参考图视角', 300)

              physical = audit.get('physical_profile')
              require(isinstance(physical, dict), '缺少产品物理形态 physical_profile')
              physical_keys = ['silhouette_proportions', 'parts_count', 'openings_connections', 'material_appearance', 'color_zones', 'pattern_logo_placement', 'visible_texture']
              audit['physical_profile'] = {
                  key: text(physical.get(key), f'物理形态 {key}', 900) for key in physical_keys
              }

              expected_aux_ids = [f'AUX{i:02d}' for i in range(1, len(auxiliary_files) + 1)]
              relations = audit.get('auxiliary_relations')
              relations = relations if isinstance(relations, list) else []
              by_id = {}
              for item in relations:
                  if not isinstance(item, dict):
                      continue
                  match = re.fullmatch(r'AUX[ _-]*0*([1-3])', str(item.get('id', '')).upper())
                  if match:
                      key = f'AUX{int(match.group(1)):02d}'
                      by_id[key] = item if key not in by_id else {}
              checked_relations = []
              for expected_id in expected_aux_ids:
                  item = by_id.get(expected_id, {})
                  valid = item.get('relation') in ['confirm', 'supplement', 'ignored_conflict'] and bool(item.get('evidence'))
                  checked_relations.append({
                      'id': expected_id,
                      'view': str(item.get('view') or 'unknown')[:120],
                      'relation': item['relation'] if valid else 'ignored_conflict',
                      'scope': item.get('scope') if item.get('scope') in ['global','front_only','back_only','side_only','detail_only'] else 'detail_only',
                      'evidence': str(item.get('evidence') or '未能可靠确认此辅助图，仅使用主参考图')[:500],
                  })
              audit['auxiliary_relations'] = checked_relations
              audit['asset_ids'] = {'primary': 'PRIMARY', 'auxiliary': expected_aux_ids}

              locks = audit.get('identity_constraints')
              require(isinstance(locks, list) and 3 <= len(locks) <= 8, '产品一致性约束需有 3–8 条')
              audit['identity_constraints'] = [text(item, '一致性约束', 450) for item in locks]
              audit['identity_prompt'] = text(audit.get('identity_prompt'), '英文产品保真提示词', 3500)
              require(isinstance(audit.get('unknowns'), list), '缺少未知信息列表')
              audit['unknowns'] = [text(item, '未知信息', 300) for item in audit['unknowns']]

              generated = audit.get('fields')
              require(isinstance(generated, list) and [str(item.get('id')) for item in generated] == GENERATED_FIELD_IDS,
                      '模型只需按顺序生成第1、3、4、5项')
              checked_fields = []
              for field in generated:
                  key = str(field['id'])
                  options = field.get('options')
                  require(isinstance(options, list) and len(options) == 3, f'第{key}项必须有三个示例')
                  checked = [validate_field_value(key, text(item, f'第{key}项示例', 900)) for item in options]
                  require(len(set(checked)) == 3, f'第{key}项示例不能重复')
                  checked_fields.append({'id': key, 'options': checked})
              audit['fields'] = [checked_fields[0], {'id': '2', 'options': list(PLATFORMS)}, *checked_fields[1:]]

              state = {'selections': {}, 'issues': {}, 'status': 'pending', 'message': ''}
              result = {'audit': dumps(audit), 'state': dumps(state), 'display': render_form(audit, state), 'image_types': dumps(TYPES)}
              result.update(_choice_options(audit, state))
              return result


          def inspect_audit(raw, primary_files, auxiliary_files, product_category):
              try:
                  prepare(raw, primary_files, auxiliary_files, product_category)
                  return {'ok': 'yes', 'raw': raw, 'message': ''}
              except (ValueError, TypeError, KeyError, IndexError) as exc:
                  return {'ok': 'no', 'raw': raw, 'message': str(exc)}


          def apply_form(state_raw, audit_raw, choices, customs, image_types=None):
              state, audit = read(state_raw), read(audit_raw)
              if image_types is not None:
                  selected = json.loads(image_types)
                  require(isinstance(selected, list) and selected and all(item in TYPES for item in selected)
                          and len(set(selected)) == len(selected), '请至少选择一种商品图类型')
                  state['image_types'] = [name for name in TYPES if name in selected]
              require(isinstance(choices, list) and len(choices) == 5, '必须提交五项结构化选择')
              require(isinstance(customs, list) and len(customs) == 5, '必须提交五项自定义文本状态')
              selections = state.setdefault('selections', {})
              issues = state.setdefault('issues', {})
              for i, (field, raw_choice, raw_custom) in enumerate(zip(audit['fields'], choices, customs), 1):
                  key = str(i)
                  allowed = [_saved_option(selections[key])] if key in selections and key not in issues else option_values(field)
                  require(isinstance(raw_choice, str) and raw_choice in allowed, f'第{i}项选择不在当前允许选项中')
                  if raw_choice.startswith('LOCKED|||'):
                      continue
                  mode, encoded = raw_choice.split('|||', 1)
                  if key == '2':
                      require(mode == 'PLATFORM' and encoded in PLATFORMS, '第2项必须选择固定平台')
                      entry = {'mode': 'PLATFORM', 'value': encoded}
                  elif mode in 'ABC' and len(mode) == 1:
                      entry = {'mode': mode, 'value': field['options']['ABC'.index(mode)]}
                  elif mode == 'D':
                      entry = {'mode': 'D', 'value': ''}
                  else:
                      if not isinstance(raw_custom, str) or not raw_custom.strip() or len(raw_custom) > 3500:
                          issues[key] = '请填写非空且不超过 3500 字的自定义内容。'
                          continue
                      try:
                          custom_value = validate_field_value(key, raw_custom)
                      except ValueError as exc:
                          issues[key] = str(exc)
                          continue
                      entry = {'mode': 'custom', 'value': custom_value}
                  selections[key] = entry
                  issues.pop(key, None)
              complete = len(selections) == 5 and not issues
              state['status'] = 'checking' if complete else 'pending'
              state['message'] = '' if complete else '请只修正仍待填写或存在商品身份冲突的项目。'
              return {'state': dumps(state), 'complete': 'yes' if complete else 'no'}


          def parse_reply(reply, state_raw, audit_raw):
              """Legacy numbered-text parser kept for compatibility; the Studio DSL does not call it."""
              state, audit = read(state_raw), read(audit_raw)
              reply = str(reply or '').strip()
              pattern = r'(?:^|[\n;；]+)\s*([1-5１-５])\s*[.．、:：)）=\-]?\s*'
              matches = list(re.finditer(pattern, reply))
              errors, seen = [], set()
              if not matches or reply[:matches[0].start()].strip():
                  errors.append('请按“编号 + 选项或自定义内容”填写。')
              for j, match in enumerate(matches):
                  key = str(int(match.group(1)))
                  value = reply[match.end():matches[j + 1].start() if j + 1 < len(matches) else len(reply)].strip()
                  if key in seen:
                      state['issues'][key] = '同一回复出现重复选择，请重新指定一个。'
                      continue
                  seen.add(key)
                  if key == '2' and value in PLATFORMS:
                      entry = {'mode': 'PLATFORM', 'value': value}
                  else:
                      chosen = value.upper().strip()
                      if chosen in 'ABCD' and len(chosen) == 1 and key != '2':
                          field = audit['fields'][int(key) - 1]
                          entry = {'mode': chosen, 'value': field['options']['ABC'.index(chosen)] if chosen != 'D' else ''}
                      else:
                          custom = re.sub(r'^(?:自定义|自訂|自定)\s*[:：]?\s*', '', value).strip()
                          try:
                              entry = {'mode': 'custom', 'value': validate_field_value(key, custom)}
                          except ValueError as exc:
                              state['issues'][key] = str(exc)
                              continue
                  state['selections'][key] = entry
                  state['issues'].pop(key, None)
              state['message'] = '\n'.join(errors)
              complete = len(state['selections']) == 5 and not state['issues'] and not errors
              state['status'] = 'checking' if complete else 'pending'
              return {'state': dumps(state), 'complete': 'yes' if complete else 'no'}


          def resolve(raw, state_raw):
              state, result = read(state_raw), read(raw)
              require(len(state['selections']) == 5, '未确认五项，不得生成')
              conflicts = result.get('conflicts')
              auto = result.get('auto_values')
              require(isinstance(conflicts, list) and isinstance(auto, dict), '审核结果格式错误')
              issues = {}
              for item in conflicts:
                  if item.get('kind') != 'identity':
                      continue
                  keys = item.get('fields')
                  reason = text(item.get('reason'), '冲突说明', 800)
                  require(isinstance(keys, list) and keys, '商品身份冲突必须指出具体字段')
                  for key in map(str, keys):
                      require(key in state['selections'], '冲突字段编号无效')
                      if key in {'3', '4', '5'}:
                          issues[key] = reason
              state['issues'] = issues
              state['message'] = '只需修改下列会改变商品本体的要求；其他偏好已经保留。' if issues else ''
              if issues:
                  state['status'] = 'pending'
                  return {'state': dumps(state)}

              expected = {key for key, entry in state['selections'].items() if entry['mode'] == 'D'}
              require(set(auto) == expected, 'Agent 只能设计用户选择 D 的字段')
              approved_form = {}
              for key, entry in state['selections'].items():
                  value = text(auto[key], '自由设计内容') if entry['mode'] == 'D' else entry['value']
                  if key == '1' and entry['mode'] == 'D' and not (_LANGUAGE_PATTERN.search(value) or _NO_TEXT_PATTERN.search(value)):
                      value = '无文字：纯视觉商业表达'
                  value = validate_field_value(key, value)
                  approved_form[key] = {'name': FIELDS[int(key) - 1], 'source': entry['mode'], 'value': value}
              state['approved_form'] = approved_form
              state['status'] = 'approved'
              return {'state': dumps(state)}
           

          def pack_state(state_raw, audit_raw):
              state, audit = read(state_raw), read(audit_raw)
              result = {
                  'state': state_raw,
                  'status': state['status'],
                  'display': render_form(audit, state) if state['status'] == 'pending' else '偏好已确认，正在生成所选图片提示词。',
                  'image_types': dumps(state.get('image_types', TYPES)),
              }
              result.update(_choice_options(audit, state))
              return result


          def basis(state_raw, audit_raw):
              state, audit = read(state_raw), read(audit_raw)
              approved = state.get('status') == 'approved'
              image_types = state.get('image_types', TYPES)
              approved_form = state.get('approved_form', {})
              platform = approved_form.get('2', {}).get('value')
              package = {
                  'product': audit['summary'],
                  'declared_category': audit['declared_category'],
                  'primary_view': audit['primary_view'],
                  'physical_profile': audit['physical_profile'],
                  'auxiliary_relations': audit['auxiliary_relations'],
                  'asset_ids': audit['asset_ids'],
                  'identity_constraints': audit['identity_constraints'],
                  'identity_prompt': audit['identity_prompt'],
                  'unknowns': audit['unknowns'],
                  'preference_form': approved_form,
                  'image_types': image_types,
                  'platform_profile': build_platform_profile(platform, image_types) if approved else {},
              }
              message = (
                  '任务已停止，没有生成提示词。'
                  if state.get('status') == 'cancelled'
                  else '两次补问后仍有会改变商品本体的要求，请重新开始。'
              )
              return {'ok': 'yes' if approved else 'no', 'package': dumps(package) if approved else '', 'message': message}


          def deliver(raw, package_raw):
              result, package = read(raw), read(package_raw)
              images = result.get('images')
              selected = package.get('image_types')
              profile = package.get('platform_profile')
              require(isinstance(selected, list) and selected and all(name in TYPES for name in selected), '图片类型选择无效')
              require(isinstance(profile, dict) and profile.get('platform') in PLATFORMS, '缺少平台画布预设')
              expected_canvases = profile.get('canvases')
              require(isinstance(expected_canvases, list) and len(expected_canvases) == len(selected), '平台画布数量无效')
              require(isinstance(images, list) and len(images) == len(selected), '输出数量必须与所选图片类型一致')
              known_aux = set(package.get('asset_ids', {}).get('auxiliary', []))
              parts = [
                  f'# 商品图提示词（{len(selected)} 张）',
                  f"平台：{profile['platform']}。五项表单是设计偏好；PRIMARY 与物理形态是商品一致性底线。",
              ]
              for i, (item, name, expected) in enumerate(zip(images, selected, expected_canvases), 1):
                  require(item.get('type') == name == expected.get('type'), f'第{i}张图类型或顺序不正确')
                  canvas = text(item.get('canvas'), f'{name}画布规格', 100)
                  require(canvas == expected.get('canvas'), f'{name}画布必须为 {expected.get("canvas")}')
                  design = text(item.get('design_prompt'), f'{name}设计提示词', 16000)
                  resources = item.get('resources')
                  require(isinstance(resources, list) and resources, name + '缺少偏好使用记录')
                  used_fields = set()
                  for resource in resources:
                      require(isinstance(resource, dict), '偏好使用记录格式错误')
                      key = str(resource.get('field'))
                      require(key in package['preference_form'], '偏好字段无效')
                      text(resource.get('use'), '偏好使用方式', 1200)
                      used_fields.add(key)
                  require({'1', '2'} <= used_fields, name + '的 resources 必须包含字段1和字段2')

                  plan = item.get('reference_plan')
                  require(isinstance(plan, dict), name + '缺少 reference_plan')
                  require(plan.get('identity_anchor_id') == 'PRIMARY', name + '必须以 PRIMARY 为商品身份主锚点')
                  view_ids = plan.get('view_reference_ids')
                  excluded_ids = plan.get('excluded_reference_ids')
                  require(isinstance(view_ids, list) and all(isinstance(x, str) for x in view_ids), name + '补充参考图列表无效')
                  require(isinstance(excluded_ids, list) and all(isinstance(x, str) for x in excluded_ids), name + '排除参考图列表无效')
                  expected_aux = package['asset_ids']['auxiliary']
                  require(view_ids == expected_aux and set(view_ids) == known_aux, name + '必须按绑定顺序使用全部辅助图')
                  require(excluded_ids == [], name + '不得排除绑定辅助图')
                  target_view = text(plan.get('target_view'), f'{name}目标视角', 200)

                  item['identity_prompt'] = package['identity_prompt']
                  supplement = '、'.join(view_ids) if view_ids else '无'
                  excluded = '、'.join(excluded_ids) if excluded_ids else '无'
                  routing = (
                      f'Identity anchor: PRIMARY. Target view: {target_view}. '
                      f'Use every bound auxiliary reference in order: {", ".join(view_ids) if view_ids else "none" }. '
                      'No bound reference is excluded.'
                  )
                  combined = package['identity_prompt'] + '\n\n' + routing + '\n\n' + design
                  parts += [
                      f'## {i}. {name}',
                      f'**画布规格**：{canvas}',
                      '### 手动生图参考图上传',
                      '- 始终上传：PRIMARY 主参考图',
                      f'- 每张图均按顺序使用全部绑定辅助参考图：{supplement}',
                      '### 可复制完整提示词',
                      combined,
                  ]
              return {'answer': '\n\n'.join(parts), 'package': dumps({'basis': package, 'images': images})}


          def main(raw, package_raw):
              return deliver(raw, package_raw)
