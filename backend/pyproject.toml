[project]
name = "image-business-backend"
version = "0.1.0"
description = "Business backend for private multi-image generation workflows"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.0",
    "celery==5.6.3",
    "fastapi==0.142.2",
    "httpx==0.28.1",
    "Pillow==12.3.0",
    "psycopg[binary]==3.3.5",
    "pydantic-settings==2.15.0",
    "python-multipart==0.0.32",
    "SQLAlchemy==2.0.54",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "jsonschema==4.26.0",
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "integration: requires the dedicated image-backend-test PostgreSQL and RabbitMQ services",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
